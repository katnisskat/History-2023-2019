<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>의학역사와 윤리 기출 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e17;--sur:#1a1830;--sur2:#252340;--acc:#e8a838;--acc2:#d45f3c;--ok:#3ecf8e;--ng:#e05252;--tx:#f0ece4;--mu:#8b8799;--bd:rgba(232,168,56,.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;background-image:radial-gradient(ellipse at 20% 20%,rgba(212,95,60,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(232,168,56,.06) 0%,transparent 60%)}
#app{width:100%;max-width:740px}

/* ── NAV TABS ── */
.tabs{display:flex;gap:4px;background:var(--sur);border-radius:14px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:10px;border:none;background:transparent;color:var(--mu);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;border-radius:10px;cursor:pointer;transition:.2s}
.tab.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0f0e17;font-weight:700}

/* ── SCREENS ── */
.screen{display:none;animation:fadeUp .4s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── START ── */
.hero{text-align:center;margin-bottom:32px}
.badge{display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0f0e17;font-size:11px;font-weight:700;letter-spacing:3px;padding:5px 14px;border-radius:20px;margin-bottom:20px;text-transform:uppercase}
h1{font-family:'Noto Serif KR',serif;font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.2;margin-bottom:10px;background:linear-gradient(135deg,#f0ece4 40%,var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--mu);font-size:14px;line-height:1.7}
.stats{display:flex;gap:12px;justify-content:center;margin:24px 0;flex-wrap:wrap}
.stat{background:var(--sur);border:1px solid var(--bd);border-radius:12px;padding:14px 20px;text-align:center}
.stat-n{font-size:26px;font-weight:700;color:var(--acc);font-family:'Noto Serif KR',serif}
.stat-l{font-size:11px;color:var(--mu);margin-top:3px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.cat-card{background:var(--sur);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;cursor:pointer;transition:.2s;text-align:left;user-select:none}
.cat-card:hover,.cat-card.on{border-color:var(--acc);background:var(--sur2)}
.cat-card.on{box-shadow:0 0 0 2px var(--acc)}
.ci{font-size:20px;margin-bottom:6px}
.cn{font-size:13px;font-weight:500}
.cc{font-size:11px;color:var(--mu);margin-top:2px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0f0e17;border:none;padding:14px 36px;border-radius:50px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:.2s;letter-spacing:.5px}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,168,56,.3)}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-s{background:transparent;color:var(--mu);border:1px solid rgba(255,255,255,.12);padding:12px 24px;border-radius:50px;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:.2s}
.btn-s:hover{border-color:var(--tx);color:var(--tx)}

/* ── QUIZ ── */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.q-prog{font-size:12px;color:var(--mu)}
.q-score-badge{background:var(--sur);border:1px solid var(--bd);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--acc);font-weight:600}
.pbar{background:var(--sur);height:3px;border-radius:2px;margin-bottom:24px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:width .4s ease}
.q-cat{font-size:11px;letter-spacing:2px;color:var(--acc);text-transform:uppercase;margin-bottom:10px;font-weight:600}
.q-card{background:var(--sur);border:1px solid var(--bd);border-radius:18px;padding:24px;margin-bottom:16px}
.q-text{font-family:'Noto Serif KR',serif;font-size:clamp(14px,2.5vw,17px);line-height:1.75;color:var(--tx)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--sur);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:14px 18px;text-align:left;color:var(--tx);font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:.2s;display:flex;align-items:flex-start;gap:11px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--sur2)}
.opt-n{width:26px;height:26px;min-width:26px;border-radius:50%;background:var(--sur2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mu);transition:.2s;margin-top:1px}
.opt.correct{border-color:var(--ok)!important;background:rgba(62,207,142,.08)!important}
.opt.correct .opt-n{background:var(--ok);color:#0f0e17}
.opt.wrong{border-color:var(--ng)!important;background:rgba(224,82,82,.08)!important}
.opt.wrong .opt-n{background:var(--ng);color:#fff}
.opt.correct-hint{border-color:var(--ok)!important;background:rgba(62,207,142,.05)!important}
.opt.correct-hint .opt-n{background:rgba(62,207,142,.3);color:var(--ok)}
.opt.dim{opacity:.35}
.opt:disabled{cursor:not-allowed}
.exp-box{border-radius:13px;padding:14px 18px;margin-top:14px;font-size:13px;line-height:1.7;animation:fadeUp .3s ease}
.exp-ok{background:rgba(62,207,142,.07);border:1px solid rgba(62,207,142,.2);color:#a8e6cb}
.exp-ng{background:rgba(224,82,82,.07);border:1px solid rgba(224,82,82,.2);color:#f5a9a9}
.next-wrap{text-align:center;margin-top:20px}

/* ── WRONG LIST ── */
.wrong-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:gap}
.wrong-count{font-size:13px;color:var(--mu)}
.wrong-list{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.wrong-item{background:var(--sur);border:1px solid rgba(224,82,82,.2);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.2s}
.wrong-item:hover{border-color:rgba(224,82,82,.5);background:var(--sur2)}
.wi-cat{font-size:10px;letter-spacing:2px;color:var(--ng);text-transform:uppercase;margin-bottom:6px;font-weight:600}
.wi-q{font-size:13px;line-height:1.55;color:var(--tx);font-family:'Noto Serif KR',serif}
.wi-detail{margin-top:10px;display:none;font-size:12px;color:var(--mu);line-height:1.6;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}
.wi-detail.open{display:block}
.wi-ans{color:var(--ok);font-weight:600;margin-top:4px}
.wi-exp{margin-top:6px}
.empty-wrong{text-align:center;padding:60px 20px;color:var(--mu)}
.empty-icon{font-size:48px;margin-bottom:16px}

/* ── RESULT ── */
#result{text-align:center}
.res-circle{width:130px;height:130px;border-radius:50%;border:3px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;background:radial-gradient(circle,rgba(232,168,56,.1),transparent)}
.res-s{font-size:36px;font-weight:700;font-family:'Noto Serif KR',serif;color:var(--acc)}
.res-t{font-size:13px;color:var(--mu)}
.res-title{font-family:'Noto Serif KR',serif;font-size:24px;margin-bottom:8px}
.res-msg{color:var(--mu);margin-bottom:24px;font-size:13px}
.breakdown{background:var(--sur);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:24px;text-align:left}
.bd-title{font-size:11px;color:var(--mu);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
.bd-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.bd-item:last-child{border-bottom:none}
.bd-ok{color:var(--ok);font-weight:600}
.bd-ng{color:var(--ng);font-weight:600}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(26,24,48,.95);border:1px solid var(--bd);border-radius:12px;padding:12px 20px;font-size:13px;color:var(--tx);backdrop-filter:blur(8px);z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button class="tab active" onclick="showScreen('start')">🏠 홈</button>
    <button class="tab" onclick="showScreen('wrong')">❌ 오답노트</button>
  </div>

  <!-- START -->
  <div id="start" class="screen active">
    <div class="hero">
      <div class="badge">🏛 기출 퀴즈 2019-2023</div>
      <h1>의학역사와 윤리</h1>
      <p class="sub">기말고사 기출 문제 전체 수록<br>오답은 자동 저장됩니다</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="total-cnt">0</div><div class="stat-l">총 문제</div></div>
      <div class="stat"><div class="stat-n" id="wrong-cnt" style="color:var(--ng)">0</div><div class="stat-l">오답 저장</div></div>
      <div class="stat"><div class="stat-n" id="solved-cnt" style="color:var(--ok)">0</div><div class="stat-l">누적 정답</div></div>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="btn-row">
      <button class="btn-p" id="start-btn" onclick="startQuiz('all')">전체 시작 →</button>
      <button class="btn-s" onclick="startQuiz('wrong')" id="wrong-btn">오답만 풀기</button>
      <button class="btn-s" onclick="toggleAll()">전체 선택/해제</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen">
    <div class="q-header">
      <span class="q-prog" id="q-prog"></span>
      <span class="q-score-badge" id="q-score">점수 0</span>
    </div>
    <div class="pbar"><div class="pbar-fill" id="pbar-fill"></div></div>
    <div class="q-cat" id="q-cat"></div>
    <div class="q-card"><div class="q-text" id="q-text"></div></div>
    <div class="opts" id="opts"></div>
    <div id="exp-area"></div>
    <div class="next-wrap hidden" id="next-wrap">
      <button class="btn-p" id="next-btn" onclick="nextQ()">다음 문제 →</button>
    </div>
  </div>

  <!-- WRONG NOTE -->
  <div id="wrong" class="screen">
    <div class="wrong-header">
      <h2 style="font-family:'Noto Serif KR',serif;font-size:20px">❌ 오답노트</h2>
      <span class="wrong-count" id="wn-count"></span>
    </div>
    <div id="wrong-list"></div>
    <div class="btn-row" id="wrong-btns"></div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="res-circle">
      <div class="res-s" id="res-s"></div>
      <div class="res-t" id="res-t"></div>
    </div>
    <h2 class="res-title" id="res-title"></h2>
    <p class="res-msg" id="res-msg"></p>
    <div class="breakdown" id="breakdown"></div>
    <div class="btn-row">
      <button class="btn-p" onclick="startQuiz('wrong')" id="res-retry">오답 다시풀기</button>
      <button class="btn-s" onclick="showScreen('start')">처음으로</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════
// QUESTION BANK
// ════════════════════════════════════════════════════════
const Q = [
// ── 전염병·역학 ──────────────────────────────────────────
{id:"e01",cat:"2023 기말",q:"14세기 흑사병 원인 가설 중 '질병의 사회적 구성'을 의미하는 것은?",o:["유례없는 천체 현상·기후변화에 의해 발생","교황의 대립·종교인 타락에 대한 신의 벌","도시의 위생 상태가 불결하여 발생","소수 민족과 이방인 그리고 여행자들이 전파시킴","흉작으로 인한 기근으로 사람들이 허약해짐"],a:3,exp:"소수민족·이방인·여행자를 탓하는 것은 사회적 편견과 낙인이 질병 원인론에 결합된 '사회적 구성'입니다."},
{id:"e02",cat:"2023 기말",q:"흑사병 대처 대책 중 '질병의 사회적 구성'을 의미하는 대책은?",o:["향이 진한 약초 마스크·보안경·장갑 착용","정부의 검역법(Quarantine Law) 제정","백치·마녀·유대인을 고문으로 자백받고 화형","흑사병 환자 격리소 수용·가택 연금","채찍질 고행파의 육체적 속죄"],a:2,exp:"마녀·유대인을 희생양 삼아 화형한 것은 사회적 편견이 질병 대응에 반영된 대표적 사례입니다."},
{id:"e03",cat:"2023 기말",q:"흑사병이 유럽 경제·정치에 미친 영향: 농장 노동 인력 부족으로 붕괴된 것은?",o:["도시 자치 제도","화폐 경제","봉건제도","교황 권위","길드 제도"],a:2,exp:"노동력 감소 → 수확 불가 → 기근 → 봉건제도 붕괴 → 도시 중간 계급 등장의 흐름입니다."},
{id:"e04",cat:"2023 기말",q:"콜레라 전파: (가) 벵골 지역 군인 2만 명 사망 / (나) 1817~1823년 무역로 통해 동남아·유럽 전파. 용어 변화로 올바른 것은?",o:["가. Endemic → 나. Pandemic","가. Endemic → 나. Epidemic","가. Epidemic → 나. Pandemic","가. Epidemic → 나. Endemic","가. Epidemic → 나. Epidemic"],a:0,exp:"벵골 특정 지역 풍토병(Endemic)이 전 세계로 확산되면 팬데믹(Pandemic)입니다."},
{id:"e05",cat:"2023 기말",q:"콜레라 1~3차 대유행의 배경으로 알맞지 않은 것은?",o:["교통과 세계무역","나폴레옹 러시아 원정","5차 러시아-페르시아 전쟁","식민지 확장","대영제국 군사 이동"],a:1,exp:"나폴레옹 러시아 원정(1812)은 발진티푸스 유행과 관련 있고, 콜레라 1~3차 대유행(1817~1851)의 직접 배경이 아닙니다."},
{id:"e06",cat:"2023 기말",q:"결핵균 발견(1882)~항결핵제 개발(1946) 64년간 치료법 없이도 사망자가 감소한 가장 중요한 이유는?",o:["정부 주관 결핵예방법 홍보·교육","쓰레기 처리와 도시 위생 개선","주택 보급 증가와 거주 환경 개선","양질의 의복 착용으로 신체 보호","식생활 개선으로 인한 영양상태 호전"],a:4,exp:"영양 상태 호전으로 면역력이 개선된 것이 항결핵제 없이도 사망률을 낮춘 가장 중요한 이유입니다."},
{id:"e07",cat:"2023 기말",q:"1918년 스페인 독감이 20~40대 젊은 층 사망률이 높았던 가장 중요한 원인은?",o:["전쟁으로 박테리아성 폐렴 예방접종 불가","1차 세계대전 병사들이 지쳐 감염됨","특정 연령대에 높은 감염률(50%)을 보임","원인 바이러스가 H2N2 아형이었으므로","면역력이 강한 사람일수록 사이토카인 폭풍이 심해 사망"],a:4,exp:"강한 면역반응(사이토카인 폭풍)이 젊은 층에서 오히려 더 심한 폐 손상을 일으켜 사망률을 높였습니다."},
{id:"e08",cat:"2023 기말",q:"말라리아 근절 사업(DDT+습지 제거) 실패의 가장 중요한 이유는?",o:["살충제와 습지 파괴는 다른 피해 유발","말라리아 원충 백신 개발이 어렵다","원충을 옮기는 모기를 완전히 박멸 불가","말라리아는 인간 외 다른 생물에서도 기생 가능","나쁜 공기를 완전히 제거할 수 없다"],a:3,exp:"말라리아 원충은 동물 숙주에서도 생존하므로 인간만 격리해도 근절이 불가능합니다."},
{id:"e09",cat:"2023 기말",q:"신종 전염병의 특징으로 옳지 않은 것은?",o:["새로운 병원체 출현·변이에 의한 경우는 흔하지 않음","상당수가 신약 개발 동물실험 부작용으로 발생","전염에 유리한 환경에서 의사들의 주목으로 신종 인지되는 경우가 흔함","존재하던 것을 인식하지 못하다가 어느 시점에 인식하게 되는 경우가 흔함","처음 인지 당시의 특성이 질병에 반영되어 신종이 만들어지는 것이 흔함"],a:1,exp:"신종 전염병이 신약 개발 동물실험 부작용으로 발생한다는 것은 근거 없는 설명입니다."},
{id:"e10",cat:"2023 기말",q:"HIV 혈청 양성 반응자 격리 수용 정책의 모순점으로 적절한 것은?",o:["감염 후 바이러스 증가와 증상 발현까지 시간이 매우 짧음","HIV 감염 후 혈청 반응 양성 전환에 몇 달이 걸릴 수 있음","환자 아닌 사람에게 HIV 피하는 교육만으로는 에이즈 예방 불가","동성애·정맥 주사 금지에 대한 간접 홍보 가능","격리 수용 비용이 많이 들어도 인권을 위해 필요"],a:1,exp:"혈청 전환에 수개월이 걸리므로 음성 판정자도 이미 감염된 전파자일 수 있어 격리 정책에 허점이 생깁니다."},
{id:"e11",cat:"2023 기말",q:"발진티푸스에 대한 설명으로 옳은 것은?",o:["고대 이래 서아시아 지역 풍토병으로 교역·전쟁을 통해 유행","1566년 신성로마제국-오스만 전쟁에서 신성로마제국 군대에서 유행","온대지역 비위생적 환경에 사는 사람들에게 발생","원인: Rickettsia prowazeki, 발견자 이름을 따 명명","반상발진이 가슴·얼굴·팔과 손바닥에 나타남"],a:1,exp:"1566년 신성로마제국-오스만 전쟁 시 신성로마제국 군대에서 발진티푸스가 유행했습니다. 매개체는 이(louse)입니다."},
{id:"e12",cat:"2023 기말",q:"수인성 전염병 콜레라 오염 순환고리: 인간 → (A) → 하수. A에 들어갈 것은?",o:["오염된 물","토양","배설물","식품","동물"],a:2,exp:"인간 → 배설물 → 하수 → 오염된 식수 → 인간의 순환고리를 형성합니다."},
{id:"e13",cat:"2023 기말",q:"투키디데스 이후 전염병 고찰: '아무리 고도의 기술을 동원해도 유행병을 억제 못할 수 있다. (A)은(는) 새로운 질병을 만들거나 기존 것을 악화시킬 수 있다.' A에 들어갈 말은?",o:["사회적 요인","환경 변화","의학적 개입","병원체 변이","기후 변화"],a:2,exp:"의학적 개입 자체가 새로운 질병을 만들거나 기존 것을 악화시킬 수 있다는 것이 핵심 통찰입니다."},
{id:"e14",cat:"2023 기말",q:"페스트(흑사병)의 원인 병원체 Yersinia pestis를 옮기는 벡터는?",o:["모기","쥐벼룩","이(louse)","진드기","체체파리"],a:1,exp:"흑사병은 쥐벼룩(rat flea)이 인간을 물어 Yersinia pestis를 전파합니다."},
{id:"e15",cat:"2023 기말",q:"발진티푸스의 병원체를 옮기는 벡터(매개체)는?",o:["모기","쥐벼룩","이(louse)","진드기","파리"],a:2,exp:"발진티푸스는 이(louse, 몸이)에 의해 매개되며, 비위생적·밀집 환경에서 크게 유행합니다."},

// ── 세균설·미생물 ───────────────────────────────────────
{id:"g01",cat:"2023 기말",q:"최초로 세균과 같은 생물체의 존재를 의심하여 '전염병 종자설'을 주장한 학자는?",o:["루이 파스퇴르","조제프 리스터","로버트 코흐","아타나시우스 키르허","지롤라모 프라카스토로"],a:4,exp:"16세기 이탈리아 의사 프라카스토로가 전염병은 '생명을 가진 종자(seminaria)'에 의해 전파된다고 최초로 주장했습니다."},
{id:"g02",cat:"2023 기말",q:"염색·배양 기술로 결핵균·탄저균·콜레라균을 발견하고 4가지 코흐 원칙을 확립한 학자는?",o:["루이 파스퇴르","조제프 리스터","로버트 코흐","에드워드 제너","이그나츠 제멜바이스"],a:2,exp:"로버트 코흐(1843~1910)의 코흐 원칙 및 주요 세균 발견 업적입니다."},
{id:"g03",cat:"2023 기말",q:"세균 배양법 개발, 계대배양으로 독성 감소, 살아있는 동물로 광견병 백신을 만든 학자는?",o:["루이 파스퇴르","조제프 리스터","로버트 코흐","에드워드 제너","이그나츠 제멜바이스"],a:0,exp:"루이 파스퇴르가 세균 배양법 개발, 닭콜레라·탄저·광견병 백신을 개발했습니다."},
{id:"g04",cat:"2023 기말",q:"코흐 원칙 3번째: '배양한 균을 (D)에게 주입했을 때 같은 증상을 일으켜야 한다'. D에 해당하는 것은?",o:["특정 실험 환경","분리된 균주","순수 배양체","질병 감수성이 있는 실험동물","증상이 있는 환자"],a:3,exp:"'질병 감수성이 있는 실험동물'에 균을 주입했을 때 같은 증상을 유발해야 합니다."},
{id:"g05",cat:"2023 기말",q:"미아즈마설(나쁜 공기설)에 기반한 조치로 볼 수 없는 것은?",o:["도시 상수도 설치","도시 환경 미화","병원에서 청결한 병상 유지","병원 내부를 정기적으로 소독","오물·쓰레기 처리 규정 제정"],a:3,exp:"소독은 세균을 죽이는 것으로 세균설에 기반한 조치입니다. 미아즈마설은 '나쁜 공기' 제거에 초점을 맞춥니다."},
{id:"g06",cat:"2023 기말",q:"제너 우두접종법(1796)과 제멜바이스 산욕열 예방(1847)의 공통된 의의는?",o:["질병을 야기하는 성분에 노출시켜 면역을 얻음","질병 성분을 사전에 차단하여 예방","병원체에 대한 지식 없이 예방에 성공","본체론적 질병관을 전제로 임상 시험에 접근","예방을 넘어 항생제 개발의 계기가 됨"],a:2,exp:"두 발견 모두 세균의 실체를 모르면서도 경험적 관찰만으로 예방에 성공한 역사적 사례입니다."},
{id:"g07",cat:"2023 기말",q:"프라카스토로 종자설에서 '전파 방식'으로 포함되지 않는 것은?",o:["직접 접촉에 의해 전파","간접 접촉(물건 매개)에 의해 전파","곤충과 가축에 의한 매개체 전파","원거리 전파(공기 전파)","종자들은 생명을 가진 전염체로 분열·번식한다"],a:2,exp:"프라카스토로는 직접 접촉, 간접 접촉, 원거리 전파를 주장했으나 '곤충·가축 매개체 전파'는 현대 개념입니다."},
{id:"g08",cat:"2023 기말",q:"조지프 리스터가 골절·수술 시 사용한 소독약은?",o:["에탄올","과산화수소수","석탄산(페놀)","요오드","포르말린"],a:2,exp:"리스터는 파스퇴르 세균설을 바탕으로 석탄산(carbolic acid, 페놀)을 사용하여 외과 소독법을 개발했습니다."},
{id:"g09",cat:"2023 기말",q:"4체액설(히포크라테스)에 도전하여 해부병리학으로 반박한 학자는?",o:["갈레노스","모르가니","베살리우스","파스퇴르","코흐"],a:1,exp:"조반니 바티스타 모르가니가 해부병리학(부검)으로 4체액설에 도전하여 장기 병변이 질병 원인임을 주장했습니다."},
{id:"g10",cat:"2023 기말",q:"갈레노스의 3체계론에 도전하여 '파브리카'로 근대 해부학을 확립한 학자는?",o:["모르가니","베살리우스","파스퇴르","코흐","리스터"],a:1,exp:"안드레아스 베살리우스가 1543년 파브리카(De Humani Corporis Fabrica)를 발표하여 갈레노스의 오류를 정정했습니다."},
{id:"g11",cat:"2023 기말",q:"미아즈마설을 반박하고 세균설 확립에 기여한 3인의 조합으로 올바른 것은?",o:["히포크라테스, 갈레노스, 베살리우스","파스퇴르, 리스터, 코흐","모르가니, 비샤, 베살리우스","제너, 제멜바이스, 파레","라레, 빌로트, 홀스테드"],a:1,exp:"파스퇴르(세균 배양·백신), 리스터(소독법), 코흐(코흐 원칙·결핵균)가 세균설 확립의 3대 인물입니다."},

// ── 외과·마취 역사 ────────────────────────────────────────
{id:"s01",cat:"2023 기말",q:"BC 3000~2000년경 두개 개구술 후 뼈가 아문 두개골에 대한 추론으로 가장 적절한 것은?",o:["당시 두개 개구술은 보편적으로 시행되는 시술이었다","두개골 개방골절 환자 생존에 대한 경험적 관찰이 있었다","해로운 체액을 배출하거나 악귀를 내보내기 위해 시술했다","두개 개구술 후 시술받은 자의 생존 가능성을 추측할 수 있다","경막 외·하 혈종 치료를 위해 시술했다"],a:3,exp:"뼈가 아문 흔적 = 수술 후 살아남은 증거. 따라서 시술 후 생존 가능성을 추측할 수 있습니다."},
{id:"s02",cat:"2023 기말",q:"고대 중국(사리풀 독)·인도(약초 훈증)·그리스(알코올·아편) 외상 처치의 주 목적은?",o:["상처 감염 방지","상처 통증 감소","상처 출혈 억제","상처 치유 촉진","상처 재발 방지"],a:1,exp:"사리풀, 아편, 알코올은 모두 진통·마취 효과가 있으므로 통증 감소가 주 목적입니다."},
{id:"s03",cat:"2023 기말",q:"고대 그리스-로마 전사들이 상처에 창검의 녹을 바르고 붕대 처치를 한 목적으로 가장 적절한 것은?",o:["상처 감염 방지","상처 통증 감소","상처 출혈 억제","상처 치유 촉진","상처 재발 방지"],a:0,exp:"금속의 녹(산화금속)은 항균 효과가 있어 고대에 감염 방지 목적으로 사용되었습니다."},
{id:"s04",cat:"2023 기말",q:"끓는 기름이 부족해 장미기름·테레빈유·계란노른자를 상처에 발라준 환자가 다음날 고통이 사라진 것을 본 사건의 의의는?",o:["열유소작법 부작용을 이론적으로 증명","장미유·테레빈유·계란노른자 연고 효과를 이론적으로 증명","열유소작법이 잘못됨을 임상시험으로 증명","장미유·테레빈유·계란노른자 연고 효과를 위해 임상시험 진행","열유소작법이 잘못되었음을 우연히 증명"],a:4,exp:"끓는 기름이 부족하여 대안을 썼더니 우연히 그 효과를 발견한 것으로, 계획된 실험이 아니었습니다."},
{id:"s05",cat:"2023 기말",q:"이발사-외과의사(barber-surgeon)에 대한 설명으로 틀린 것은?",o:["서양에서 18세기 초까지 이발사들이 외과의사를 겸했다","이발소 삼색 기둥: 붉은색=동맥, 파란색=정맥, 흰색=신경 또는 힘줄","대학의 의학부는 내과의사와 이발사-외과의사를 구분하여 양성하였다","동서양 모두 외과의사의 신분과 사회적 지위가 내과의사보다 낮았다","파레, 스트로마이어, 바르티시 모두 barber-surgeon 출신이다"],a:2,exp:"대학은 내과의사만 양성했으며, 이발사-외과의사는 대학 외부에서 도제 방식으로 훈련받았습니다."},
{id:"s06",cat:"2023 기말",q:"1846년 10월 16일 보스턴 메사추세츠 병원 목 종양 제거 수술에서 사용된 마취제는?",o:["알코올(술)","아산화질소(N₂O)","에테르(ether)","클로로포름(Chloroform)","아편"],a:2,exp:"치과의사 윌리엄 토머스 그린 모튼이 에테르(ether)를 사용하여 역사적인 첫 공개 전신마취 수술을 시행했습니다."},
{id:"s07",cat:"2023 기말",q:"빅토리아 여왕이 레오폴드 왕자 출산 시 무통분만에 사용되어 널리 보급된 마취제는?",o:["리도카인","이산화질소(N₂O)","에테르","클로로포름(Chloroform)","아편"],a:3,exp:"클로로포름이 빅토리아 여왕의 분만에 사용된 후 산과적 마취로 널리 보급되었습니다."},
{id:"s08",cat:"2023 기말",q:"도미니크 장 라레의 업적으로 옳지 않은 것은?",o:["군진의학 발전에 공헌하고 군진 외과학을 저술했다","수술 솜씨가 뛰어나고 트리아제(triage)를 개발했다","ambulance volantes 부대를 창설했다","flying ambulance를 기획했다","나폴레옹 러시아 원정 보르디노 전투 시 200건의 복부수술을 시행했다"],a:4,exp:"보르디노 전투에서 라레는 하루 200건이 넘는 '사지 절단술'을 시행했습니다. 복부수술이 아닙니다."},
{id:"s09",cat:"2023 기말",q:"12세기 고름 분류: (라) 분홍색 고름은?",o:["바람직한 고름","봉와직염을 예고","염증과 괴저를 예고","바람직하지 않으나 괴저와 무관","출혈을 동반한 고름"],a:2,exp:"분홍색 고름(라)은 염증과 괴저를 예고하는 나쁜 고름이었습니다. 흰색·묽은 장액성 고름이 바람직한 고름이었습니다."},
{id:"s10",cat:"2023 기말",q:"결석 제거술(절석술)의 특징으로 옳은 것은?",o:["코와 이마 사이 피부 피판을 이용하는 성형술","회음부를 절개하여 방광결석을 제거하는 수술","뇌압을 낮추기 위해 두개골을 여는 수술","불투명해진 수정체를 안구 후방으로 밀어 넣는 수술","탈장된 장기를 복강 안으로 밀어 넣는 수술"],a:1,exp:"고대~중세 절석술은 회음부를 절개하여 방광결석을 제거하는 위험한 수술이었습니다."},
{id:"s11",cat:"2023 기말",q:"고대부터 근대 초기까지 백내장 치료에 사용된 수술법으로, 불투명해진 수정체를 꼬챙이로 안구 내부로 밀어 넣는 방법은?",o:["각막절개술","수정체유화술","발와술(couching)","라식","홍채절제술"],a:2,exp:"발와술(couching)은 불투명해진 수정체를 얇은 기구로 안구 후방으로 밀어 동공에서 벗어나게 하는 고대 백내장 치료법입니다."},
{id:"s12",cat:"2023 기말",q:"프랑스 시민혁명·나폴레옹 전쟁이 근대 의학 발전에 끼친 영향으로 적절하지 못한 것은?",o:["국민의회가 의과대학 33개 폐쇄 후 누구든지 의사가 될 수 있도록 했다","대불동맹 전쟁으로 군의관 필요성 대두, 의학교가 다수 개설되었다","에콜드상테(국립위생학교)는 내과와 외과를 평등하게 처우했다","내과의사 기득권이 배척되고 실사구시적 외과가 존중되었다","에콜드상테는 이후 국립의학교로 개칭되어 육군사관학교 소속 군진의학 기관이 되었다"],a:4,exp:"에콜드상테는 국립의학교로 개칭되었으나 '육군사관학교 소속'이 아니라 독립적인 의학교육 기관으로 발전했습니다."},
{id:"s13",cat:"2023 기말",q:"이동외과병원(MASH)에 대한 설명으로 적절하지 않은 것은?",o:["전선에서 10마일 이내 설치, 고도의 외과 술기 신속 적용","이동식 외과팀이 발달한 형태로 일종의 후송 병원이었다","기록상 한 달간 1만 2천 명의 환자를 처리했다","모든 전성 사망은 2.4%, 복부 외상 사망은 8.8%로 감소했다","미국 5개, 노르웨이와 한국이 각각 1개 운영했다"],a:1,exp:"MASH는 후송 병원이 아니라 전방에서 즉각적인 외과 처치를 제공하는 전진 외과팀의 발전된 형태입니다."},
{id:"s14",cat:"2023 기말",q:"한국전쟁이 의학 발전에 미친 영향으로 옳지 않은 것은?",o:["3년간 거대한 임상실습장 제공","군진의학 도약의 계기","외과학과 마취·수술법의 발전 계기","구순구개열 교정 수술법의 발전","자궁경부암 원인 인유두종 바이러스가 수혈로 전파된다는 사실 발견"],a:4,exp:"인유두종 바이러스(HPV)가 수혈로 전파된다는 사실은 한국전쟁과 무관합니다."},
{id:"s15",cat:"2023 기말",q:"소아마비 연구 '1939년 흰쥐에 폴리오바이러스를 감염시켜 생쥐에서 소아마비 유발 성공'의 의의는?",o:["원인 병원체 생물학적 연구와 항원 성분 대량 확보 가능","연구 시설·재원을 줄여 연구자 저변 확대 가능","질병 병태생리 연구를 위한 질병 모델 개발","투여 방법이 간편하여 어린이 예방접종에 도움","질병 발생 가능성 없이 예방접종 가능"],a:1,exp:"흰쥐·생쥐를 사용하면 영장류 대비 비용·시설이 줄어 더 많은 연구자가 참여할 수 있게 됩니다."},

// ── 의료윤리 ─────────────────────────────────────────────
{id:"m01",cat:"2023 기말",q:"제네바 선언 중 '나이, 질병, 장애, 종교, 민족, 성별, 국적, 정당, 인종, 성적 취향, 사회적 지위 등에 관계없이 의무를 다하겠다'와 관련있는 의료윤리 원칙은?",o:["자율성의 원칙","선행의 원칙","악행금지의 원칙","정의의 원칙","자율성과 선행의 원칙"],a:3,exp:"모든 사람을 차별 없이 동등하게 대한다는 것은 '정의(Justice)의 원칙'에 해당합니다."},
{id:"m02",cat:"2023 기말",q:"임상시험에서 환자의 '설명 후 동의(informed consent)'와 관련있는 의료윤리 원칙은?",o:["자율성의 원칙","선행의 원칙","정의의 원칙","악행금지의 원칙","자율성과 선행의 원칙"],a:0,exp:"환자 스스로 충분한 정보를 받고 결정을 내리는 것은 '자율성(Autonomy)의 원칙'과 관련됩니다."},
{id:"m03",cat:"2023 기말",q:"조현병 환자가 추운 겨울 거리를 방황할 때 의사가 다시 데려오려 하나 환자가 거부할 때 고려해야 하는 의료윤리 원칙은?",o:["자율성과 악행금지의 원칙","선행과 정의의 원칙","선행과 악행금지의 원칙","자율성과 정의의 원칙","자율성과 선행의 원칙"],a:4,exp:"환자를 위해 치료를 원하는 의사의 '선행'과 환자의 의사를 존중하는 '자율성'이 충돌하는 상황입니다."},
{id:"m04",cat:"2023 기말",q:"복강경 경험 없는 의사가 충수돌기 제거술 집도 중 하대정맥 손상을 유발한 사례와 관련있는 의료윤리 원칙은?",o:["자율성의 원칙","선행의 원칙","악행금지의 원칙","정의의 원칙","자율성과 신뢰의 원칙"],a:2,exp:"의사의 미숙한 행위가 환자에게 해를 끼쳤으므로 '악행금지(Non-maleficence)의 원칙' 위반입니다."},
{id:"m05",cat:"2023 기말",q:"뉘른베르크 강령의 선포 배경으로 옳은 것은?",o:["1932년 터스키기 매독 실험 시작 이후","1947년 아우슈비츠 생체실험에 대한 반성으로 선포","1964년 헬싱키 선언 이후 보완","1945년 731부대 해산 이후 국제 사회 요구","1961년 탈리도마이드 사건 이후"],a:1,exp:"1945년 뉘른베르크 전범 재판 이후, 반인륜적 생체실험 재발 방지를 위해 1947년 인체 실험의 10가지 원칙(뉘른베르크 강령)이 선포되었습니다."},
{id:"m06",cat:"2023 기말",q:"뉘른베르크 강령을 이어받아 1964년 제18차 세계의사협회에서 채택한 인체실험 윤리 선언문은?",o:["제네바 선언","뉘른베르크 강령 개정판","헬싱키 선언","알마아타 선언","리스본 선언"],a:2,exp:"1964년 헬싱키 선언은 뉘른베르크 강령을 발전시켜 인체 연구에서의 윤리 원칙을 담은 선언문입니다."},
{id:"m07",cat:"2023 기말",q:"히포크라테스 선서 2단락 계승자 조건으로 옳지 않은 것은?",o:["스승의 아들이면 제자가 될 수 있다","자신의 아들이면 제자가 될 수 있다","외부인 중 선서 관습에 따라 계약한 그리스 사람이면 제자가 될 수 있다","스승이 경제적으로 어려우면 나의 것을 함께 나눈다","나의 스승을 부모처럼 대하고 평생 함께해야 한다"],a:2,exp:"외부인도 제자가 될 수 있으나, '그리스 사람'이라는 민족 제한 조건은 없었습니다. 의료 관습에 따른 선서·계약이 조건입니다."},
{id:"m08",cat:"2023 기말",q:"선서 3~6단락 구체적 의술 사례에 대한 설명으로 틀린 것은?",o:["모든 환자에 대한 치료는 기본적으로 섭생법 처방이다","악행 금지의 원칙이 뚜렷하다","치명적인 약에 대해 신중하게 조언해야 한다","의사는 칼로 치료하면 안된다","여성에 대한 낙태용 페서리 처방을 금지하고 있다"],a:2,exp:"히포크라테스 선서는 치명적인 약에 대해 '신중하게 조언'하는 것도 금지합니다. 조언 자체를 하면 안 됩니다."},
{id:"m09",cat:"2023 기말",q:"히포크라테스 선서 1단락 시작기도에서 증인으로 세우지 않은 것은?",o:["아폴론","아스클레피오스","아스클레피오스의 어머니","아스클레피오스의 딸 휘기에이아","아스클레피오스의 딸 파나케이아"],a:2,exp:"선서 1단락에서는 아폴론, 아스클레피오스, 아스클레피오스의 딸들(휘기에이아, 파나케이아)을 증인으로 세웠습니다. '어머니'는 언급되지 않습니다."},
{id:"m10",cat:"2023 기말",q:"선서 3단락 '나는 능력과 판단에 따라 환자를 돕기 위해 섭생법을 처방할 것이며 비행으로부터 보호하겠습니다'에 나타나는 히포크라테스 의학의 정신으로 적절하지 못한 것은?",o:["선행의 원칙과 악행금지의 원칙이 나타나 있다","의학의 주체는 의사이며 의사 주체성의 원칙이 나타나 있다","의학의 목적으로 인도주의 정신을 내세우고 있다","치료 방법 우선순위를 이야기하고 있다","어떤 경우라도 수술적 치료법은 사용하지 않겠다는 의지를 담고 있다"],a:4,exp:"이 단락은 섭생법 우선의 원칙과 선행·악행금지를 담고 있으며, 수술을 완전히 배제한다는 내용은 없습니다."},
{id:"m11",cat:"2023 기말",q:"아우슈비츠에서 일란성 쌍둥이를 대상으로 생체실험을 주도하고 국제 군사재판을 피해 도주한 독일 군의관은?",o:["요제프 멩겔레","이시이 시로","존 커틀러","카를 브란트","지그문트 라셔"],a:0,exp:"요제프 멩겔레(Josef Mengele)는 '죽음의 천사'로 불리며 아우슈비츠에서 쌍둥이를 대상으로 잔인한 실험을 했습니다."},
{id:"m12",cat:"2023 기말",q:"731부대의 사령관이었으며 중일전쟁 중 생물학전 연구를 담당했던 인물은?",o:["요제프 멩겔레","이시이 시로","존 커틀러","카를 브란트","시로 이시이"],a:1,exp:"이시이 시로(石井四郎)는 만주 하얼빈에서 731부대를 이끌며 생물무기 연구와 인체실험을 지휘했습니다."},
{id:"m13",cat:"2023 기말",q:"터스키기 실험·교도소 임질 실험·과테말라 성병 실험을 주관한 미국 의사는?",o:["요제프 멩겔레","이시이 시로","존 커틀러","윌리엄 오슬러","벤자민 러시"],a:2,exp:"존 커틀러(John Cutler)는 미 공중보건국 소속으로 세 가지 비윤리적 인체실험을 주관했습니다."},
{id:"m14",cat:"2023 기말",q:"보건의료제도: '국민 세금으로 의료 서비스 재원을 확보하는' 제도는?",o:["직장 의료보험제도","국가 의료보험제도","국민 건강보험제도","국가 의료서비스","국가 의료보장제도"],a:4,exp:"국가 의료보장제도(National Health Service)에서 국민 세금으로 재원을 확보하여 전 국민에게 의료서비스를 제공합니다."},
{id:"m15",cat:"2023 기말",q:"의사규칙(의사·한의사 자격 규정)에 대한 설명으로 옳지 않은 것은?",o:["의사의 근대적 개념을 사회적으로 제도화","의사의 역할과 자격에 대해 최초로 규정","주된 내용은 양의사에 관한 것이지만 한의사에 대해서도 자격과 역할을 명시","의사가 전문직으로 자리잡고 사회적 지위를 높이는 데 크게 기여","국가가 의료행위의 배타적 권리를 면허를 통해 의사에게 보장"],a:2,exp:"의사규칙의 주된 내용은 양의사에 관한 것으로, 한의사에 대해서는 별도로 자격을 명시하지 않았습니다."},

// ── 한국 의학사 ───────────────────────────────────────────
{id:"k01",cat:"2023 기말",q:"우리나라 최초의 근대 서양식 의료기관으로 일본 해군 군의관이 부산에 세웠던 병원은?",o:["광제원","대한의원","시병원","제중원","제생의원"],a:4,exp:"제생의원(濟生醫院)은 1877년 일본 해군 군의관이 부산에 설립한 우리나라 최초의 근대 서양식 의료기관입니다."},
{id:"k02",cat:"2023 기말",q:"1885년 알렌이 설립한 조선 최초의 근대식 병원은?",o:["광제원","대한의원","광혜원(제중원)","제생의원","시병원"],a:2,exp:"알렌이 1885년 설립한 광혜원은 곧 제중원으로 개칭되었으며, 세브란스 병원의 전신입니다."},
{id:"k03",cat:"2023 기말",q:"의료계의 '통감부' 역할을 한 기관은?",o:["제생의원","대한의원","조선총독부의원","광혜원","대비원"],a:1,exp:"대한의원은 일제가 조선 의료를 장악하는 통감부 역할을 했으며, 이후 조선총독부의원으로 이어집니다."},
{id:"k04",cat:"2023 기말",q:"조선후기 일반 백성·민중의 진료를 담당했던 의료기관은?",o:["내의원","전의감","혜민서","동활인서","서활인서"],a:2,exp:"혜민서는 조선시대 일반 백성들의 진료를 담당했습니다. 내의원은 왕실, 전의감은 의학교육을 담당했습니다."},
{id:"k05",cat:"2023 기말",q:"세종대왕 때 집현전이 편찬한 한당 이래 고전 방서에서 명초 방서까지 망라한 의학 총서의 이름은?",o:["동의보감","의방유취","향약집성방","마과회통","의약론"],a:1,exp:"의방유취(醫方類聚)는 세종 27년(1445)에 편찬된 의학 백과전서로, 보물 제1234호입니다."},
{id:"k06",cat:"2023 기말",q:"불교 대자대비 정신에 따라 고려시대 개성의 동쪽과 서쪽에 설치된 구호기관은?",o:["혜민국","제생원","대비원","의녀제도","활인서"],a:2,exp:"대비원(大悲院)은 고려시대 불교정신에 따라 설립된 구호기관으로, 개성 동·서에 하나씩 있었습니다."},
{id:"k07",cat:"2023 기말",q:"조선 정부가 우두술을 국가사업으로 채택하여 보급하기 시작한 해는?",o:["1876년","1881년","1882년","1885년","1897년"],a:3,exp:"1885년 조선 정부가 우두술을 국가사업으로 채택하여 보급하기 시작했습니다."},
{id:"k08",cat:"2023 기말",q:"'인체의 해부학적 구조와 생리학적 기능을 세밀하게 잘 설명하고 있다'며 서양 의학에 긍정적 평가를 내린 조선 후기 실학자는?",o:["이익","신후담","안정복","박제가","이규경"],a:0,exp:"성호 이익(李瀷)이 서양의학서 한문 번역본을 읽고 해부학과 생리학에 이치가 명확하다고 평가했습니다."},
{id:"k09",cat:"2023 기말",q:"일제강점기 의학전문학교의 인원 구성으로 옳은 것은?",o:["조선인 2/3, 일본인 1/3","조선인 1/2, 일본인 1/2","조선인 1/3, 일본인 2/3","조선인 1/4, 일본인 3/4","거의 대부분 일본인"],a:2,exp:"일제강점기 의학전문학교는 조선인 1/3, 일본인 2/3로 구성되었습니다."},
{id:"k10",cat:"2023 기말",q:"조선여자의학강습소를 설립하여 경성 여자 의학전문학교의 기초를 만든 미국 선교사·여의사는?",o:["알렌","호러스 언더우드","로제타 서우드 홀","올리버 에비슨","메리 스크랜턴"],a:2,exp:"로제타 서우드 홀(Rosetta Sherwood Hall)이 1928년 조선여자의학강습소를 설립했습니다."},
{id:"k11",cat:"2023 기말",q:"일제강점기 조선의 전염병 관리에 대해 옳은 것은?",o:["1915년 전염병예방령이 최초의 근대적 전염병 관리법이다","조선·대만 거주 일본인보다 일본 본토 일본인의 전염병 사망자가 훨씬 많았다","조선 거주 일본인보다 대만 거주 일본인의 전염병 사망자가 훨씬 많았다","1899년 대한제국의 전염병 예방 규칙은 일제강점기 이후 기능을 완전히 상실했다","조선 전염병 실태 조사는 잘 되지 않았지만 호열자 실태 조사는 잘 되었다"],a:2,exp:"조선총독부 통계에 따르면 대만 거주 일본인의 전염병 환자 수·사망자 수가 조선 거주 일본인보다 훨씬 많았습니다."},
{id:"k12",cat:"2023 기말",q:"제국대학에 대한 설명으로 옳은 것은?",o:["1947년까지 일본 본토에 7개교, 식민지에 2개교, 최초는 교토제국대학이다","일본 식민지에 세워진 대학은 도호쿠제국대학과 다이호쿠제국대학이다","예과는 학부 진학 전 단계로, 예과 기간이 4년이다","조선에 세워진 제6 제국대학 경성제국대학은 석사 학위를 수여한 최초의 대학이다","경성제국대학은 법학부와 의학부로만 구성되어 미군부에 의해 폐교되었다"],a:3,exp:"경성제국대학은 민립대학 설립을 막기 위해 세워졌으며, 법문학부와 의학부로 출발했습니다(이후 이공학부 추가)."},
{id:"k13",cat:"2023 기말",q:"조선시대 삼의사 제도 중 의학교육을 담당한 기관은?",o:["내의원","전의감","혜민서","활인서","제중원"],a:1,exp:"전의감(典醫監)은 의학교육과 의약 행정을 담당했습니다. 내의원은 왕실 의료, 혜민서는 서민 의료 담당이었습니다."},
{id:"k14",cat:"2023 기말",q:"광복 이후 한국 보건/의료 제도에 대한 설명으로 옳지 않은 것은?",o:["약사는 1949년 1003명에서 1998년 46998명으로 약 45배 증가","간호사는 1949년 1549명에서 1998년 359812명으로 약 230배 증가","1969년 의료보험법이 이후 2000년 국민건강보험법으로 확대","진료는 의사가, 처방은 약사가 하는 의약분업이 2000년 8월부터 시행","의료기관은 1995년에 비해 1998년에 6배 증가, 대규모 병원 중심 경향"],a:3,exp:"의약분업은 진료는 의사가, '조제'는 약사가 담당하는 제도입니다. '처방'이 아닌 '조제'가 분리되었습니다."},
{id:"k15",cat:"2023 기말",q:"코로나19 팬데믹 2020년 8~9월 의사 총파업 당시 반대했던 정부 의료정책으로 적절한 것은?",o:["한방의료 급여화 / 지방의대 신설","의대 정원 증원 / 원격의료","지방의대 신설 / 원격의료","한방의료 급여화 / 의대 정원 증원 / 지방의대 신설","한방의료 급여화 / 의대 정원 증원 / 지방의대 신설 / 원격의료 모두"],a:1,exp:"2020년 의사 파업은 주로 의대 정원 증원과 원격의료 도입에 반대하여 이루어졌습니다."},

// ── 2019 기말 – 20세기 의료제도 ─────────────────────────
{id:"y19_01",cat:"2019 기말",q:"의학과 의술의 발전으로 수많은 질병의 효과적 치료와 예방이 가능해지면서 질병의 치료와 건강 증진의 주체가 개인 또는 가족에서 사회 또는 국가로 변하였다. 이와 관련있는 20세기 의학의 특징은?",o:["의료제도의 발전","질병 양상의 변화","의료화 사회","의료의 산업화","생명의료윤리 개념의 등장"],a:0,exp:"건강 증진의 주체가 개인에서 국가·사회로 변한 것은 '의료제도의 발전'을 의미합니다."},
{id:"y19_02",cat:"2019 기말",q:"20세기 의료계 특이현상 중 하나인 '의사파업'이 흔히 발생하는 형태의 보건의료제도는?",o:["국가 사회복지제도","국가 의료보장제도","국가 건강서비스","국가 의료보험제도","국민 건강보험제도"],a:1,exp:"국가 의료보장제도(national insurance)에서는 의사가 국가와 보수 협상을 하는 구조여서 파업이 발생하기 쉽습니다."},
{id:"y19_03",cat:"2019 기말",q:"주로 집에서 출생과 사망이 발생하던 과거에 비해 병원 출생과 병원 사망이 주를 이루게 되면서 '출생증명서'와 '사망진단서'를 발급하는 '병원'과 '의사'의 역할이 커지게 되었다. 이와 관련있는 20세기 의학의 특징은?",o:["생명의료윤리 개념의 등장","의료제도의 발전","의료의 산업화","의료화 사회","질병 양상의 변화"],a:3,exp:"출생과 사망까지 병원·의사가 관장하게 된 것은 일상이 의료화된 '의료화 사회'를 의미합니다."},
{id:"y19_04",cat:"2019 기말",q:"한국에서 2000년도에 발생한 의사파업과 2014년도에 의사파업 직전까지 갔던 사태는 무엇 때문에 발생했는가?",o:["2000년 포괄수가제, 2014년 비보험 수가 청구권 축소","2000년 의약분업, 2014년 비보험 수가 청구권 축소","2000년 의약분업, 2014년 포괄수가제","2000년 포괄수가제, 2014년 원격진료","2000년 포괄수가제, 2014년 의료보장제도 확대"],a:2,exp:"2000년 의사파업은 의약분업 시행에 반대, 2014년은 포괄수가제 확대에 반대하여 발생했습니다."},
{id:"y19_05",cat:"2019 기말",q:"보건의료제도의 목적 중 제공된 의료 서비스에 대한 대가를 받도록 하는 것이 있다. 국민 세금을 통해 의료 서비스를 위한 재원을 확보하는 것은?",o:["직장 의료보험제도","국가 의료보험제도","국민 건강보험제도","국가 건강서비스","국가 의료보장제도"],a:4,exp:"국가 의료보장제도(National Health Service)는 세금으로 재원을 마련하여 국민에게 무상 또는 저가로 의료를 제공합니다."},

// ── 2019 기말 – 전염병·역학 ─────────────────────────────
{id:"y19_e01",cat:"2019 기말",q:"14세기 유럽을 강타한 흑사병 원인에 대한 가설 중 '질병의 사회적 구성'을 의미하는 가설은?",o:["유례없는 천체 현상·기후변화에 의해 발생","교황들의 대립·종교인 타락에 대한 신의 벌","도시의 위생 상태가 불결하여 발생","소수 민족과 이방인 그리고 여행자들이 전파시킴","흉작으로 인한 기근으로 많은 사람들이 허약해짐"],a:3,exp:"소수민족·이방인·여행자를 탓하는 것은 사회적 편견이 질병의 원인론에 결합된 '사회적 구성'의 전형입니다."},
{id:"y19_e02",cat:"2019 기말",q:"14세기 유럽 흑사병 대처 대책 중 '질병의 사회적 구성'을 의미하는 대책은?",o:["의사들은 향이 진한 약초 마스크·보안경·장갑 등 착용하고 환자를 보살폈다","정부에서는 검역법(Quarantine Law)을 제정하여 시행하였다","백치들, 마녀들, 유대인들을 잡아다가 고문으로 자백을 받은 후 화형시켰다","흑사병이 들기 시작한 지역 주민들을 가택 연금시키고, 흑사병 환자들을 격리소에 수용하였다","채찍질 고행파 사람들은 육신에 고통을 가함으로써 속죄하였다"],a:2,exp:"마녀·유대인을 희생양으로 삼아 화형한 것은 사회적 낙인이 전염병 대응에 반영된 '사회적 구성' 사례입니다."},
{id:"y19_e03",cat:"2019 기말",q:"전염병()이란 바이러스, 세균, 리케차, 스피로헤타, 진균, 원충 등의 병원체가 다른 생물체에 침투하여 집단적으로 유행하는 것을 말한다. (가) 16세기 포르투갈 탐험가들 기록: 인도 캘커타 인근 벵골 지역 군인 2만명 콜레라 사망 / (나) 1817~1823년 인도 캘커타 인근 벵골 지역에서 이상기후와 함께 발생한 콜레라가 무역로를 통해 동남아·중동·유럽·동부 아프리카 전파. 가, 나에 들어갈 용어는?",o:["가. endemic → 나. pandemic","가. endemic → 나. epidemic","가. epidemic → 나. pandemic","가. epidemic → 나. endemic","가. epidemic → 나. epidemic"],a:0,exp:"특정 지역에 한정된 풍토병(endemic)이 전 세계로 확산되면 대유행(pandemic)입니다."},
{id:"y19_e04",cat:"2019 기말",q:"결핵균 발견·BCG 백신·항결핵제 등 의학적 개입 역할을 제외할 경우 결핵 사망률이 감소한 가장 중요한 이유는? (그래프: 1860년~1950년 결핵 사망률 감소 추세)",o:["정부 주관의 결핵예방법의 홍보와 교육","쓰레기 처리와 도시 위생상태의 개선","주택 보급의 증가와 거주 환경의 개선","양질의 의복 착용으로 따뜻하게 신체를 보호","식생활의 개선으로 인한 영양상태의 호전"],a:4,exp:"의학적 개입 없이도 영양 상태 개선으로 인한 면역력 향상이 결핵 사망률 감소의 가장 중요한 요인입니다."},
{id:"y19_e05",cat:"2019 기말",q:"1918년 스페인 독감이 전 세계 대부분의 대륙까지 전파되었다. 당시 사망자들의 연령을 살펴보면 아래 그래프와 같이 1918년 이전의 인플루엔자와 다른 특징을 보였다. 이에 대한 원인으로 가장 중요한 것은?",o:["전쟁으로 2차 감염인 박테리아성 폐렴에 대한 예방 접종이 되지 못했으므로","제1차 세계 대전으로 전쟁에 지친 병사들이 감염되었기 때문","극단적으로 특정 연령대에 높은 감염율(50%)을 보였으므로","원인 바이러스가 인플루엔자 A형 H2N2 아형이었으므로","면역력이 강한 사람일수록 증상이 혹독(사이토카인 폭풍)했기 때문"],a:4,exp:"강한 면역반응(사이토카인 폭풍)이 젊고 면역력이 강한 20~40대에서 오히려 더 심한 조직 손상을 일으켜 사망률을 높였습니다."},
{id:"y19_e06",cat:"2019 기말",q:"말라리아는 매년 5억명의 환자가 발생하고, 200~300만명(주로 어린이)이 사망하는 무서운 질병이다. 병원체는 말라리아 원충이며, 학질모기(Anopheles albimanus)가 전파의 벡터 역할을 한다. 1955년 세계보건기구(WHO)는 DDT살포와 습지 제거를 통한 말라리아 근절 사업에 착수하였으나 결과적으로 이 사업은 실패하였다. 가장 중요한 실패 이유는?",o:["살충제와 습지 파괴는 또 다른 피해를 유발할 수 있다","말라리아 원충에 대한 백신을 만들기가 어렵다","원충을 옮기는 모기를 완전히 박멸할 수 없다","말라리아 전파를 촉진하는 나쁜 공기를 완전히 제거할 수 없다","말라리아는 인간이 아닌 다른 생물에서도 기생이 가능하다"],a:4,exp:"말라리아 원충은 인간 외 다른 동물 숙주에서도 생존할 수 있으므로 인간 대상 근절만으로는 완전한 박멸이 불가능합니다."},
{id:"y19_e07",cat:"2019 기말",q:"다음은 신종 전염병( )의 특징에 대한 설명이다. 적절하지 못한 것은?",o:["새로운 원인 병원체의 출현이나 변이로 인한 경우는 흔하지 않음","상당수의 신종 전염병이 신약 개발을 위한 동물실험의 부작용으로 발생했음","전염에 유리한 환경에서 의사들의 주목으로 신종으로 인지되는 경우가 흔함","존재해 오던 것을 인식하지 못하다가 어느 시점에 인식하게 되는 경우가 흔함","처음 인지 당시의 특성이 질병에 반영되어 신종이 만들어지는 것이 흔함"],a:1,exp:"신종 전염병이 신약 개발 동물실험의 부작용으로 발생한다는 것은 근거 없는 설명입니다."},
{id:"y19_e08",cat:"2019 기말",q:"HIV/AIDS 정책의 모순점에 대한 설명으로 적절한 것은? (HIV 감염 경과 그래프 제시)",o:["감염 후 바이러스 증가와 증상발현까지 걸리는 시간이 매우 짧음","HIV에 감염되어도 혈청 반응 양성으로 전환되는 데 몇 달이 걸릴 수 있음","환자가 아닌 사람들에게 HIV를 피하는 방법 교육으로는 에이즈 예방이 불가능","동성애와 무분별한 정맥 주사 사용 등의 행위 금지에 대한 간접적 홍보 가능","격리 수용에 많은 비용이 들어도 사회복지와 인권을 위해 필요"],a:1,exp:"혈청 전환까지 수개월이 걸리므로, 격리 당시 음성 판정자도 실제로는 감염자일 수 있어 격리 정책에 허점이 생깁니다."},

// ── 2019 기말 – 세균설·학자 ──────────────────────────────
{id:"y19_g01",cat:"2019 기말",q:"다음은 '세균설' 확립에 기여한 학자들 중 어느 학자의 업적인가? (세균배양 방법 개발, 계대배양으로 독성을 감소시킨 배양물로 가축을 면역시키는 방법을 개발, 살아있는 동물에서 백신을 만드는데 성공하여 광견병에 걸린 환자를 백신으로 치료함)",o:["루이 파스퇴르 (Louis Pasteur)","조제프 리스터 (Joseph Lister)","로버트 코흐 (Heinrich Hermann Robert Koch)","에드워드 제너 (Edward Jenner)","이그나츠 제멜바이스 (Ignaz Philipp Semmelweis)"],a:0,exp:"세균 배양법 개발, 독성 약화 백신, 광견병 백신 치료까지 모두 루이 파스퇴르의 업적입니다."},
{id:"y19_g02",cat:"2019 기말",q:"염색과 배양 기술을 통해 폐 결핵의 원인균인 결핵균과 탄저균, 콜레라균을 발견함. 특정 박테리아가 질병의 원인임을 확정하기 위한 4가지 원칙을 확립한 학자는?",o:["루이 파스퇴르 (Louis Pasteur)","조제프 리스터 (Joseph Lister)","로버트 코흐 (Heinrich Hermann Robert Koch)","에드워드 제너 (Edward Jenner)","이그나츠 제멜바이스 (Ignaz Philipp Semmelweis)"],a:2,exp:"로버트 코흐가 결핵균·탄저균·콜레라균을 발견하고 코흐 원칙(Koch's Postulates) 4가지를 확립했습니다."},
{id:"y19_g03",cat:"2019 기말",q:"세균설(germ theory)의 발전 역사에서 처음으로 세균과 같은 생물체의 존재를 의심하여 전염병 가설을 세우고 다음과 같은 주장을 펼친 학자는? (전염병은 사람이나 물건에 의해 전파되는 종자들(seeds) 때문에 생기며, 종자들은 생명을 가진 전염체(contagium vivum)로 분열하고 번식하는 성질이 있다)",o:["루이 파스퇴르 (Louis Pasteur, 프랑스)","조제프 리스터 (Joseph Lister, 영국)","로버트 코흐 (Robert Koch, 독일)","아타나시우스 키르허 (Athanasius Kircher, 독일)","지롤라모 프라카스토로 (Girolamo Fracastoro, 이탈리아)"],a:4,exp:"16세기 이탈리아 의사 프라카스토로(Fracastoro)가 전염병 '종자설'을 최초로 주장했습니다."},
{id:"y19_g04",cat:"2019 기말",q:"의사가 산파 또는 민간 요법사 들과 경쟁적 관계에 있었던 다원주의적 의료체제가 의사들만의 독점의료체제로 변하고의 현대적 환자-의사 계약 관계의 원형을 형성하는데 가장 크게 기여한 기술로 볼 수 있는 것은?",o:["멸균법의 발견","마취술의 발전","항생 물질의 개발","의학이 종교로부터 분리","의사면허제도 등장"],a:1,exp:"마취술의 발전으로 통증 없이 안전한 수술이 가능해져 의사의 전문 영역이 확고해지고 독점 의료 체계가 형성되었습니다."},

// ── 2019 기말 – 외과·마취 역사 ──────────────────────────
{id:"y19_s01",cat:"2019 기말",q:"인류역사 초기 '외과술'의 증거로 BC 3,000 ~ BC 2,000 경으로 추정되는 두개 개구술(trephination)의 흔적이 있는 유물이 남아메리카, 서유럽, 아시아에서 비교적 흔히 발견되었다. 개구술 후 뼈가 아문 흔적이 있는 두개골에 대한 추론으로 가장 적절한 것은?",o:["당시 두개 개구술은 상당히 보편적으로 시행되는 시술이었을 것이다","두개골 개방골절 환자의 생존에 대한 경험적 관찰이 있었음을 추측할 수 있다","병태생리학적으로 볼 때 해로운 체액을 배출하거나 악귀를 내보기 위해 시술했을 것이다","두개 개구술 후 시술받은 자의 생존 가능성을 추측할 수 있다","현대 의학적으로 보면 '경막 외 혈종' 또는 '경막 하 혈종'을 치료하기 위해 시술했을 것이다"],a:3,exp:"뼈가 아문 흔적 = 수술 후 생존했다는 증거. 따라서 당시에도 두개 개구술 후 생존이 가능했음을 추측할 수 있습니다."},
{id:"y19_s02",cat:"2019 기말",q:"외상성 상처에 고대 중국에서는 사리풀 독을 사용했고, 고대 인도에서는 약초 훈증, 고대 그리스에서는 알코올과 아편을 사용했다는 기록이 있다. 당시 이런 행위의 목적으로 추측해볼 수 있는 것 중 가장 적절한 것은?",o:["상처 감염 방지","상처 통증 감소","상처 출혈 억제","상처 치유 촉진","상처 재발 방지"],a:1,exp:"사리풀, 아편, 알코올은 모두 진통·진정 효과가 있으므로 상처 통증 감소가 주 목적입니다."},
{id:"y19_s03",cat:"2019 기말",q:"고대 그리스-로마 의서에 외상성 상처에 대해 세척, 도포, 봉대처치와 포도주, 맥주, 물약(myrrh), 금속의 녹 등의 사용에 대한 기록이 있다. 전사들은 전쟁 중 상처가 생기면 창검의 녹을 상처에 바르고 봉대 처치를 했다고 한다. 당시 이런 행위의 목적으로 추측해볼 수 있는 것 중 가장 적절한 것은?",o:["상처 감염 방지","상처 통증 감소","상처 출혈 억제","상처 치유 촉진","상처 재발 방지"],a:0,exp:"금속의 녹(산화물)은 항균 효과가 있어 고대에는 상처 감염 방지 목적으로 사용되었습니다."},
{id:"y19_s04",cat:"2019 기말",q:"중세와 근대초기에 전쟁 중 화약으로 인한 상처 치료에 끓는 기름을 사용하여 소작하는 방법 즉, 열유소작법()이 사용되었는데, 이 치료가 잘못된 것임을 발견하여 이를 중지시키고 대신 [계란노른자위+장미유+테레빈유]혼합물을 사용한 사람은?",o:["아부 알 카심 (Abu al Qasim)","앙리 데 망드빌 (Henri de Mondeville)","기이 데 숄리아크 (Guy de Chauliac)","조반니 데 비고 (Giovanni de Vigo)","양브루아즈 파레 (Ambroise Paré)"],a:4,exp:"양브루아즈 파레(Ambroise Paré)가 끓는 기름이 부족하여 우연히 대안 혼합물을 사용했다가 더 효과적임을 발견했습니다."},
{id:"y19_s05",cat:"2019 기말",q:"이발사-외과의사 (barber-surgeon)에 대한 설명으로 틀린 것은?",o:["서양에서 18세기 초까지 이발사들이 외과의사를 겸했다","이발소의 삼색 기둥에서 붉은색은 동맥, 파란색은 정맥, 흰색은 신경 또는 힘줄을 상징한다","대학의 의학부는 내과의사와 이발사-외과의사를 구분하여 양성하였다","동서양 모두 외과의사의 신분과 사회적 지위가 내과의사보다 낮았다","파레, 스트로마이어, 바르티시 모두 'barber-surgeon'출신이다"],a:2,exp:"대학 의학부는 내과의사만 양성했습니다. 이발사-외과의사는 도제 방식으로 훈련받았고 대학 정식 과정에서 배우지 않았습니다."},
{id:"y19_s06",cat:"2019 기말",q:"중세 말부터 근대초기에 활동한 사람들 중 자궁탈출증 페서리, 분만 의자, 족위 회전술 등을 개발하여 산부인과를 의학의 한 분야로 발전시킨 사람은?",o:["조반니 데 비고 (Giovanni de Vigo)","양브루아즈 파레 (Ambroise Paré)","카스파르 스트로마이어 (Caspar Stromayr)","게오르게 바르티시 (George Bartisch)","자크 다비엘 (Jacques Daviel)"],a:1,exp:"양브루아즈 파레(Ambroise Paré)는 산부인과 분야에서도 자궁탈출증 페서리, 분만 의자, 족위 회전술 등을 개발했습니다."},
{id:"y19_s07",cat:"2019 기말",q:"마취술과 소독법의 개발과 함께 19세기 말부터 20세기 초까지 외과의 세기가 도래하여 다양하고 정교한 외과 수술법이 개발된다. 충수염 수술 시 충수의 위치를 추정할 수 있는 신체 표지점(body mark)을 개발한 외과의사는?",o:["테오도르 빌로트 (Theodor Billroth)","찰스 맥버니 (Charles Heber McBurney)","윌리엄 홀스테드 (William Stewart Halsted)","조지프 리스터 (Joseph Lister)","존 콜린스 워렌 (John Collins Warren)"],a:1,exp:"찰스 맥버니(McBurney)가 맥버니 포인트(McBurney's point)를 개발하여 충수의 위치를 추정하는 데 활용했습니다."},
{id:"y19_s08",cat:"2019 기말",q:"과거의 고통을 마취으로 이래 시술에서 마취제로 사용된 것은? (1846년 처음으로 보스턴에서 시술, 그 당시 시술에 참여한 John Collins Warren, William Thomas Green Morton이 관여, 그 다음 Charles Thomas Jackson Morton이 참여, 환자는 왼쪽 턱 부위 종양 제거 수술을 받음, 이 수술에서 최초로 마취 하에 시술됨)",o:["리도카인","아산화질소(N2O)","에테르(ether)","클로로포름(Chloroform)","아편"],a:2,exp:"1846년 10월 16일 보스턴 메사추세츠 병원에서 에테르(ether)를 이용한 역사적인 최초의 공개 전신마취 수술이 시행되었습니다."},
{id:"y19_s09",cat:"2019 기말",q:"19세기 대영제국을 이끌었던 빅토리아 여왕이 레오폴드 왕자를 출산할 때 무통분만 목적으로 사용되어 성공을 거둔 뒤 널리 보급된 마취제는?",o:["리도카인","아산화질소(N2O)","에테르(ether)","클로로포름(Chloroform)","아편"],a:3,exp:"클로로포름(Chloroform)이 빅토리아 여왕의 분만에 사용된 후 산과적 마취로 널리 보급되었습니다."},
{id:"y19_s10",cat:"2019 기말",q:"영국의 외과의사인 조지프 리스터(Joseph Lister, 1827~1912)는 파스퇴르 이론을 바탕으로 박테리아가 상처 감염 유발한다고 보고 이를 방지하기 위해 소독법을 개발하여 개방 골절 치료와 선택적 수술 시 수술부위를 소독하였다. 이때 사용된 소독약은 무엇인가?",o:["에탄올","요오드","과산화수소수","석탄산(페놀)","포르말린"],a:3,exp:"조지프 리스터가 개발한 소독법에서 사용된 소독약은 석탄산(carbolic acid, 페놀)입니다."},

// ── 2019 기말 – 의료윤리 ─────────────────────────────────
{id:"y19_m01",cat:"2019 기말",q:"선서의 단락1의 시작기도에 나타나는 '증인'으로서의 의학의 수호신이 아닌 것은?",o:["제우스 (Zeus)","아폴론 (Apollon)","아스클레피오스 (Asclepius)","휘기에이아 (Hygieia)","파나케이아 (Panakeia)"],a:0,exp:"히포크라테스 선서의 증인은 아폴론, 아스클레피오스, 그의 딸들인 휘기에이아와 파나케이아입니다. 제우스는 포함되지 않습니다."},
{id:"y19_m02",cat:"2019 기말",q:"선서의 단락2에 나타나는 의사-의사 계약 내용 중 의학의 계승자의 조건이 아닌 것은?",o:["의술을 배우기를 원하는 스승의 아들들","의술을 배우기를 원하는 자신의 아들들","외부인 중 의료 관습에 따라 선서하고 계약한 학생들","외부인 중 계약을 지키고 스승을 부모로 여기는 자","의술을 배우기를 원하는 코스섬 사람들"],a:4,exp:"선서 2단락의 계승자는 스승의 아들들, 자신의 아들들, 선서·계약한 외부 학생들입니다. '코스섬 사람들'이라는 지역 조건은 없습니다."},
{id:"y19_m03",cat:"2019 기말",q:"선서의 단락3~6에 나타나는 구체적 의술의 사례들에 대한 설명으로 틀린 것은?",o:["모든 환자에 대한 치료는 우선적으로 섭생법 처방이다","악행 금지의 원칙이 뚜렷이 들어난다","치명적인 약에 대해 조언하는 것도 금지하고 있다","칼로 환자를 치료하는 것을 악행으로 보고 있다","여성에 대한 낙태용 패서리 처방을 금지하고 있다"],a:3,exp:"히포크라테스 선서 단락3~6에서 '칼(수술)로 환자를 치료하는 것을 악행으로 본다'는 직접적 표현은 없습니다. 결석 제거는 전문가에게 맡긴다고 할 뿐입니다."},
{id:"y19_m04",cat:"2019 기말",q:"다음은 '선서'의 단락3이다. 여기에 나타나는 히포크라테스 의학의 정신(원칙)에 대해 설명한 것 중 적절하지 못한 것은? ('나는 나의 능력과 판단에 따라 환자를 돕기 위해 섭생법을 처방할 것이며 환자들을 위나 비행으로부터 보호하겠습니다.')",o:["의료윤리 원칙 중 '선행의 원칙'과 '악행 금지의 원칙'이 나타나 있다","의학의 주체는 의사이며, 의사 주체성의 원칙이 나타나 있다","의학의 목적으로 인도주의 정신을 내세우고 있다","치료 방법으로 섭생법(식이요법, 운동) 우선의 원칙을 표명하고 있다","어떤 경우라도 수술적 치료법은 사용하지 않겠다는 의지를 담고 있다"],a:4,exp:"단락3은 섭생법 우선을 말하지만 수술을 절대 사용하지 않겠다는 내용은 없습니다. 칼 사용 금지는 다른 단락의 내용입니다."},
{id:"y19_m05",cat:"2019 기말",q:"제네바 선언 중 '나는 환자의 나이, 질병이나 장애, 종교, 민족, 성별, 국적, 정당, 인종, 성적 취향, 사회적 지위 등에 관계없이 그들에 대한 나의 의무를 다하겠노라.'와 관련 있는 의료윤리의 원칙은?",o:["자율성(Autonomy)의 원칙","선행(Beneficence)의 원칙","악행금지(Nonmaleficence)의 원칙","정의(Justice)의 원칙","자율성(Autonomy)과 선행(Beneficence)의 원칙"],a:3,exp:"차별 없이 모든 사람에게 동등하게 의무를 다한다는 것은 '정의(Justice)의 원칙'에 해당합니다."},
{id:"y19_m06",cat:"2019 기말",q:"환자에 대한 치료법의 선택과 특히 임상시험에서 환자의 '설명 후 동의(informed consent)'와 관련 있는 의료윤리의 원칙은?",o:["자율성(Autonomy)의 원칙","선행(Beneficence)의 원칙","악행금지(Nonmaleficence)의 원칙","정의(Justice)의 원칙","자율성(Autonomy)과 선행(Beneficence)의 원칙"],a:0,exp:"환자 스스로 충분한 정보를 제공받고 자유로운 의사결정을 내리는 것은 '자율성(Autonomy)의 원칙'과 관련됩니다."},
{id:"y19_m07",cat:"2019 기말",q:"입원치료가 필요한 정신분열증이 있는 한 노숙자가 추운 겨울 거리를 방황하고 있다. 이를 발견한 의료진은 환자를 병원에 입원시켜 치료하고자 하였으나 환자는 이를 거부하고 있다. 이런 상황에서 의료진이 염두에 두어야 하는 의료윤리의 원칙은?",o:["자율성(Autonomy)과 악행금지(Nonmaleficence)의 원칙","선행(Beneficence)과 정의(Justice)의 원칙","선행(Beneficence)과 악행금지(Nonmaleficence)의 원칙","자율성(Autonomy)과 정의(Justice)의 원칙","자율성(Autonomy)과 선행(Beneficence)의 원칙"],a:4,exp:"환자를 위해 치료를 원하는 의사의 '선행'과 환자의 거부 의사를 존중하는 '자율성'이 충돌하는 윤리 상황입니다."},
{id:"y19_m08",cat:"2019 기말",q:"복강경 수술을 직접 집도해본 적이 한 번도 없는 의사가 복강경 수술 장비를 구입한 것을 기념하여 직접 복강경하 '충수돌기 제거술'을 집도하다가 실수로 트로카에 의한 하대정맥 손상을 유발하여 환자를 위험에 빠뜨리게 되었다. 관련 있는 의료윤리의 원칙은?",o:["자율성(Autonomy)의 원칙","선행(Beneficence)의 원칙","악행금지(Nonmaleficence)의 원칙","정의(Justice)의 원칙","자율성(Autonomy)과 선행(Beneficence)의 원칙"],a:2,exp:"의사의 미숙한 행위로 환자에게 해가 발생했으므로 '악행금지(Non-maleficence)의 원칙' 위반 사례입니다."},
{id:"y19_m09",cat:"2019 기말",q:"2차 세계대전 당시, 폴란드 아우슈비츠 수용소에서 각종 생체실험으로 수많은 인명을 살상한 것과 나치 독일의 전범들 및 유대인 학살 관여자들을 처벌하기 위해 1945년 독일에서 연합국 측의 국제군사재판이 이루어졌다. 아우슈비츠 수용소에서 각종 생체실험으로 유태인과 폴란드인 등 약 40만 명의 학살에 관여하였으나 당시 국제군사재판을 피해 도주한 독일 군의관으로, 특히 일란성 쌍둥이를 대상으로 잔인한 생체실험을 주로 했건 인물은? (given name과 family name 모두 기술)",o:["요제프 멩겔레 (Josef Mengele)","이시이 시로 (Shirō Ishii)","존 커틀러 (John Cutler)","카를 브란트 (Karl Brandt)","에른스트 로베르트 (Ernst Robert)"],a:0,exp:"요제프 멩겔레(Josef Mengele)는 '죽음의 천사'로 불리며 아우슈비츠에서 쌍둥이 대상 잔인한 실험을 주도했습니다."},
{id:"y19_m10",cat:"2019 기말",q:"2차 세계대전 당시 국제군사재판 이후, 1945년 군사재판 이후 반인류적인 생체실험의 재발을 막기 위해 인체를 대상으로 하는 실험(허용 가능한 의학실험)의 10가지 원칙이 재정되어 1947년에 선포되었는데, 이 원칙들이 담긴 선언문의 이름은?",o:["제네바 선언","헬싱키 선언","뉘른베르크 강령 (Nuremberg Code)","알마아타 선언","리스본 선언"],a:2,exp:"1947년 선포된 '뉘른베르크 강령(Nuremberg Code)'은 10가지 원칙으로 인체실험의 윤리적 기준을 수립했습니다."},
{id:"y19_m11",cat:"2019 기말",q:"2차 세계대전 당시의 나치즘의 인체실험에 대한 반성에서 생긴 1947년 '허용 가능한 의학실험의 10가지 원칙'을 이어 받아 의학 연구자가 스스로를 구제하기 위해 1964년 제18차 세계의사협회에서 채택한 인체실험에 대한 윤리 규범을 담은 선언문의 이름은?",o:["제네바 선언","뉘른베르크 강령","헬싱키 선언 (Declaration of Helsinki)","알마아타 선언","리스본 선언"],a:2,exp:"헬싱키 선언(Declaration of Helsinki)은 1964년 WMA가 채택한 인체 연구 윤리 원칙으로, 뉘른베르크 강령을 발전시킨 것입니다."},
{id:"y19_m12",cat:"2019 기말",q:"731부대(Unit 731, 731)는 2차 세계대전 당시 일본 제국 육군 소속 관동군 산하 비밀 생물전 연구 및 개발 기관으로 중국 헤이룽장성() 하얼빈에 있었던 부대이다. 1932년에 설립되었으며, 초기에는 '관동군 방역급수부', '동향부대'로 불렸고, 유엔에 의해 전쟁범죄로 선포되었다. 이 부대의 사령관이었으며, 중일전쟁 중 생물학전 연구를 담당했던 인물은? (given name과 family name 모두 기술)",o:["이시이 시로 (Shirō Ishii)","요제프 멩겔레 (Josef Mengele)","존 커틀러 (John Cutler)","카를 브란트 (Karl Brandt)","기타노 마사지 (Masaji Kitano)"],a:0,exp:"이시이 시로(石井四郎, Shirō Ishii)가 731부대의 사령관으로 생물무기 연구와 인체실험을 지휘했습니다."},
{id:"y19_m13",cat:"2019 기말",q:"미국 터스키기 실험은 1932년부터 40년 동안 흑인들을 대상으로 매독의 임상 경과를 관찰했던 것으로 치료하지 않은 매독이 인체에 미치는 영향 분석한 실험이었다. 싱싱 교도소 실험은 1943년 교도소 재소자를 상대로 임질 감염을 연구한 실험이었으며, 과테말라 실험은 1946년부터 2년 동안 교도소 죄수들을 대상으로 한 성병 인체실험이었다. 미국 의사이자 미 공중보건국의 수장으로 앞서 설명한 3가지 인체실험을 주관했던 인물은? (given name과 family name 모두 기술)",o:["존 커틀러 (John Charles Cutler)","요제프 멩겔레 (Josef Mengele)","이시이 시로 (Shirō Ishii)","터스키기 의사","윌리엄 오슬러 (William Osler)"],a:0,exp:"존 커틀러(John Charles Cutler)는 터스키기, 싱싱, 과테말라 세 가지 비윤리적 인체실험을 모두 주관한 미 공중보건국 의사입니다."},

// ── 2019 기말 – 한국 의학사 ──────────────────────────────
{id:"y19_k01",cat:"2019 기말",q:"우리나라(조선 후기)에 본격적으로 서양의학이 도입되기 시작한 시점은?",o:["미일화친조약(1854년) 이후","미일수호통상조약(1858년) 이후","조일수호조규(1876년) 이후","통리기무아문설치(1881년) 이후","조미수호통상조약(1882년) 이후"],a:2,exp:"조일수호조규(강화도 조약, 1876년) 이후 일본을 통해 서양 의학이 본격적으로 조선에 도입되기 시작했습니다."},
{id:"y19_k02",cat:"2019 기말",q:"우리나라 근대 의료의 도입 이전 조선후기 의료기관들 중 일반 백성들, 민중들의 진료를 담당했던 의료기관은?",o:["내의원()","전의감()","혜민서()","동활인서()","서활인서()"],a:2,exp:"혜민서(惠民署)는 조선시대 일반 백성들의 진료를 담당한 기관입니다."},
{id:"y19_k03",cat:"2019 기말",q:"우리나라 최초의 근대 서양식 의료기관으로 일본 해군 군의관이 조선에 거주하는 일본인의 진료를 위해 부산부에 세웠던 병원은?",o:["광계원()","대한의원()","제중원()","제생의원()","시병원()"],a:3,exp:"제생의원(濟生醫院)은 1877년 일본 해군 군의관이 부산에 세운 우리나라 최초의 근대 서양식 의료기관입니다."},
{id:"y19_k04",cat:"2019 기말",q:"선교의사 '알렌(Horace Newton Allen)의 권유를 받아 1885년에 세워졌고, 조선 정부가 운영했던 우리나라 최초의 근대 서양식 국립병원은?",o:["광계원()","대한의원()","제중원()","제생의원()","시병원()"],a:2,exp:"알렌의 권유로 1885년 설립된 제중원(廣惠院→濟衆院)이 조선 정부 운영의 최초 근대 서양식 국립병원입니다."},
{id:"y19_k05",cat:"2019 기말",q:"우리나라에서 1905년 을사늑약으로 설치된 통감부 중 의료계의 통감부 역할을 했던 병원은?",o:["광계원()","대한의원()","제중원()","제생의원()","시병원()"],a:1,exp:"대한의원(大韓醫院)은 을사늑약 이후 일제가 조선 의료를 장악하기 위해 설치한 기관으로 '의료계의 통감부' 역할을 했습니다."},
{id:"y19_k06",cat:"2019 기말",q:"우리나라 최초의 근대 서양식 의과대학인 '의학교()'가 설립된 후 우리나라에서 양성한 최초의 근대 서양식 의사 19명이 1회 졸업한 해는?",o:["1902년","1901년","1900년","1899년","1898년"],a:0,exp:"1902년 의학교 1회 졸업생 19명이 최초의 근대 서양식 의사로 배출되었습니다."},
{id:"y19_k07",cat:"2019 기말",q:"두창()을 예방하기 위해 우두를 피부에 접종시키는 우두접종법()은 우리나라에서 1870년대 후반부터 지석영, 이재하, 최창진, 이현유 등의 조선인들이 직접 습득하여 시술 및 보급하였다. 조선 정부에 의해 우두술을 국가 사업으로 채택하여 보급하기 시작한 해는?",o:["1876년","1881년","1882년","1885년","1897년"],a:3,exp:"1885년 조선 정부가 우두술을 국가사업으로 채택하여 보급하기 시작했습니다."},
{id:"y19_k08",cat:"2019 기말",q:"우리나라 조선 후기 실학자들은 중국에서 서양의학서를 한문으로 번역한 책을 입수하여 접할 기회가 있었으며 서양의학에 대해 조금씩 관심을 갖게 되었는데, 다음과 같은 검해를 피력했던 실학자는? ('인체의 해부학적 구조와 그것의 생리학적 기능을 세밀하게 잘 설명하고 있는바 피부, 근육, 대뇌, 신경의 작용, 대소변의 생리적 기능 등에 대한 설명이 이치가 명확하다.')",o:["이 학","신후담","안정복","박제가","이규경"],a:0,exp:"성호 이익(李瀷)이 서양의학서 한문 번역본을 접하고 해부학·생리학의 이치가 명확하다고 긍정적으로 평가했습니다."},
{id:"y19_k09",cat:"2019 기말",q:"조선시대 조선의 위생개념도 이미 발생한 병을 치료하는 수준의 의료가 아니라 병이 발생하기 전에 예방하는 차원에서 이해하고 있었으며, 이러한 개념을 실현하기 위해 조선은 삼의사 제도를 두었다. 이중에서 의학교육을 담당한 기관은?",o:["내의원","전의감","혜민서","활인서","제중원"],a:1,exp:"전의감(典醫監)은 조선시대 삼의사 중 의학교육을 담당한 기관입니다."},
{id:"y19_k10",cat:"2019 기말",q:"1884년 갑신정변()의 실패 후 일본으로 망명하였으며, 이후 미국으로 건너가 1892년 컬럼비아의대(조지워싱턴의대)를 졸업하고 조선인 최초의 서양 의사가 되었으며, 1896년 조선으로 돌아와 독립협회 활동 및 독립신문을 창간한 사람이 누구인지 기술하시오.",o:["서재필 (Philip Jaisohn)","이승만 (Syngman Rhee)","김옥균 (Kim Ok-gyun)","안창호 (Ahn Chang-ho)","박영효 (Park Yong-hyo)"],a:0,exp:"서재필(Philip Jaisohn, 피제손)은 조선 최초의 서양 의사이자 독립신문 창간자입니다."},

// ── 2019 기말 – 중세·근대초기 의학 ──────────────────────
{id:"y19_h01",cat:"2019 기말",q:"'근대 의학의 역사'라는 표현 속에 담긴 의미를 설명한 것으로 적절하지 못한 것은?",o:["시대적으로 비잔틴제국이 멸망한 이후를 말한다","지역적으로 서양의학의 역사를 말한다","주제로 보면 과학사에 속한다","시대적으로 제2차 세계 대전 종전 이전까지를 말한다","시대적으로 중세 이후 의학의 역사를 말한다"],a:1,exp:"'근대 의학의 역사'는 지역적으로 서양의학만이 아닌 전 세계 의학의 역사를 포함하므로 '서양의학의 역사를 말한다'는 설명은 적절하지 않습니다."},
{id:"y19_h02",cat:"2019 기말",q:"베살리우스 등장 후 100년 내에 인체해부학적 지식이 대부분 밝혀졌다. 이탈리아 해부학자 '히에로니무스 파브리키우스 (Hieronymous Fabricius, 1537~1619)'가 1603년에 방견한 해부학적 구조물로 영국의 생리학자 '윌리엄 하비(Wiliam Harvey, 1578~1657)'의 연구에 큰 영향을 미친 이 구조물은 무엇인지 (한글로) 기술하시오.",o:["정맥 내 판막","동맥 판막","심장 판막","뇌 판막","림프절 판막"],a:0,exp:"파브리키우스가 발견한 '정맥 내 판막'이 하비의 혈액순환 이론 확립에 결정적 영향을 주었습니다."},
{id:"y19_h03",cat:"2019 기말",q:"다음은 서양에서 19세기 초를 풍미했던 어떤 의학 철학적 사조를 설명하고 있다. 이와 같은 이론을 바탕으로, 인체 내부 변화를 찾으려는 노력과는 달리 환자가 호소하는 증상에 대한 관심은 줄어들었다. 이 의철학의 이름은 무엇인가? ('모든 질병에서 체내 기관의 변화가 규명될 것이다. 질병은 해부학적 변화이거나, 해부학적 변화로 환원될 수 있으며, 해부학적 변화는 질병의 원인이 된다.')",o:["유기체설","유기체이론","장기병리학 (Organpathologie)","병리해부학","체액설"],a:2,exp:"19세기 초 유기체설(장기병리학, Organpathologie)은 모든 질병을 해부학적 장기 변화로 환원하려 했습니다."},
{id:"y19_h04",cat:"2019 기말",q:"우리는 수업 시간에 대장금(주연: 이영애)을 보고 당시 생활상에 담겨있는 의학적 배경이 현대의학과 크게 다르지 않다는 것을 알게 되었다. 대장금의 시대적 배경은 언제인가?",o:["14세기","15세기","16세기","17세기","18세기"],a:2,exp:"대장금은 조선 중종 시대(16세기)를 배경으로 합니다."},

// ── 2019 기말 – 조선의학·대장금 동영상 ─────────────────
{id:"y19_dj01",cat:"2019 기말",q:"우리는 수업 시간에 대장금(주연: 이영애)을 보고 당시 생활상에 담겨있는 의학적 배경이 현대의학과 크게 다르지 않다는 것을 알게 되었다. 동영상 속에서 장금이가 극중에서 역질의 원인을 밝혀내는 과정('역병이 아니라 식중독이지요')은 현대의 감염병 유행 시 보건소와 질병관리본부가 수행하는 어떠한 것과 유사한가?",o:["역학조사","임상 검사","방역 활동","예방접종","격리 조치"],a:0,exp:"원인을 추적하여 밝혀내는 과정은 현대의 '역학조사(epidemiological investigation)'에 해당합니다."},
{id:"y19_dj02",cat:"2019 기말",q:"우리는 수업 시간에 대장금(주연: 이영애)을 보고 당시 생활상에 담겨있는 의학적 배경이 현대의학과 크게 다르지 않다는 것을 알게 되었다. 동영상을 통해 환자를 진료할 때 강조하고 있는 것은?",o:["시진 (視診)","청진 (聽診)","촉진 (觸診)","문진 (問診)","타진 (打診)"],a:0,exp:"대장금 동영상에서 환자의 외모·안색을 관찰하는 '시진(視診)'을 강조하고 있습니다."},
{id:"y19_dj03",cat:"2019 기말",q:"우리는 수업 시간에 대장금(주연: 이영애)을 보고 당시 생활상에 담겨있는 의학적 배경이 현대의학과 크게 다르지 않다는 것을 알게 되었다. 동영상 속에서 장금이가 소위 역학조사를 하는 장면에서 결국 알아낸 임금의 질병은 무엇인가?",o:["비소 중독","식중독","납 중독","수은 중독","매독"],a:0,exp:"대장금 동영상에서 역학조사 끝에 알아낸 임금의 질병은 비소 중독이었습니다."},
{id:"y19_dj04",cat:"2019 기말",q:"우리는 수업 시간에 대장금(주연: 이영애)을 보고 당시 생활상에 담겨있는 의학적 배경이 현대의학과 크게 다르지 않다는 것을 알게 되었다. 동영상 속에서 나타나는 이론(관찰된 결과가 처음과 달라진 것과 관련한 이론)은 현대의 어떤 이론과 연관이 있는가?",o:["호손효과 (Hawthorne effect)","플라시보 효과 (Placebo effect)","헤르미아 효과 (Hermia effect)","홀로 효과 (Halo effect)","스필오버 효과 (Spillover effect)"],a:0,exp:"관찰받는다는 사실을 알았을 때 행동이나 결과가 달라지는 현상은 '호손 효과(Hawthorne effect)'입니다."},

// ── 2019 기말 – 조선의학 서적·기타 ─────────────────────
{id:"y19_b01",cat:"2019 기말",q:"이 책은 정약용의 의학적 태도를 읽을 수 있는 대표적인 저작으로 홍역 전문의서로 크게 병의 증상을 논한 부분, 처방 모음, 본초 모음 등 세 부분으로 이루어져 있다. 이렇게 세 부분으로 구성하여 정약용은 병증으로부터 처방으로부터 약물로부터 홍역 치료를 접근할 수 있도록 했다. 이 책의 이름은?",o:["마과회통 (麻科會通)","동의보감 (東醫寶鑑)","의방유취 (醫方類聚)","향약집성방 (鄕藥集成方)","동의수세보원 (東醫壽世保元)"],a:0,exp:"마과회통(麻科會通)은 정약용이 저술한 홍역 전문 의서로, 증상·처방·본초의 세 부분으로 구성됩니다."},
{id:"y19_b02",cat:"2019 기말",q:"'의원이 의술을 업으로 삼는 것이 병을 고쳐 이익을 보자는 것인데, 마진이라는 병은 수십 년에 한번 오는 것이니 이것을 업으로 삼아서 무슨 이익이 되겠는가'라며 의원의 이익을 긍정적으로 생각하였던 조선 후기 학자는?",o:["정약용 (다산)","이 익 (성호)","신후담","안정복","박제가"],a:0,exp:"정약용(다산)이 마과회통 서문에서 의원의 이익 추구를 긍정적으로 평가한 내용입니다."},
{id:"y19_b03",cat:"2019 기말",q:"'상의는 나라를 치료하고 중의는 사람을 치료하고 하의는 병을 치료한다. 상의는 목소리를 듣고 중의는 안색을 살피며 하의는 진맥을 한다. 또 상의는 병이 나기 전에 치료하고 중의는 병이 돌려고 할 때 치료하고 하의는 병이 든 후에 치료한다'위 내용을 담고 있는 의학서의 이름은?",o:["의방유취","마과회통","의방강목","의방합편","의방유취"],a:0,exp:"의방유취(醫方類聚)에 담긴 내용으로, 의사의 등급과 예방 의학을 강조하는 구절입니다."},
{id:"y19_b04",cat:"2019 기말",q:"200년 전 일본인의 평균수명은 다른 아시아 국가에 비해 10세가 높았다. 이를 가능하게 한 일본인의 독특한 문화는?",o:["온천욕·목욕 문화","냉수 목욕 문화","사우나 문화","음식 위생 문화","운동 문화"],a:0,exp:"일본의 독특한 온천욕·목욕(목욕탕, 온천탕) 문화가 위생 유지에 기여하여 평균수명을 높인 것으로 알려져 있습니다."},

// ── 2019 기말 – 근대의학 해부·생리 ─────────────────────
{id:"y19_an01",cat:"2019 기말",q:"다음은 고대부터 근대 초기까지 사용되었던 수술법으로 백내장(cataract)을 치료하위해 사용되었던 수술방법을 설명하고 있다. 이 수술법의 이름은? ('불투명해진 렌즈를 얇은 꼬챙이와 같은 기구를 이용하여 눈 속 뒤쪽으로 밀어 떨어뜨려서 백내장이 동공을 가리지 않게 함')",o:["각막절개술 (Keratotomy)","수정체유화술 (Phacoemulsification)","발와술 (Couching)","홍채절제술 (Iridectomy)","레이저 수술 (Laser surgery)"],a:2,exp:"발와술(Couching)은 수정체를 기구로 안구 후방으로 밀어 동공을 가리지 않게 하는 고대 백내장 치료법입니다."},
{id:"y19_an02",cat:"2019 기말",q:"영국의 외과의사인 조지프 리스터(Joseph Lister, 1827~1912)는 파스퇴르 이론을 바탕으로 박테리아가 상처 감염 유발한다고 보고 이를 방지하기 위해 소독법을 개발하여 개방 골절 치료와 선택적 수술 시 수술부위를 소독하였다. 이때 사용된 소독약은 무엇인가? (1점)",o:["에탄올 (Ethanol)","과산화수소수 (H₂O₂)","석탄산 (Phenol/Carbolic acid)","요오드 (Iodine)","포르말린 (Formalin)"],a:2,exp:"리스터가 사용한 소독약은 석탄산(carbolic acid, 페놀)입니다."},

// ── 2019 기말 – 프랑스 몽펠리에 의과대학 선서 ─────────
{id:"y19_oath01",cat:"2019 기말",q:"다음은 프랑스 몽펠리에 의과대학의 졸업식 장연이다. 영상을 검토한 후 21세기에 거행되는 의사선서의 의미에 대해 논하시오. (이 문제의 키워드 답: 선서)",o:["선서 (Oath)","서약 (Pledge)","계약 (Contract)","약속 (Promise)","다짐 (Resolution)"],a:0,exp:"프랑스 몽펠리에 의과대학 졸업식에서 거행되는 것은 히포크라테스 전통을 잇는 의사선서(Oath)입니다."},

// ── 2019 기말 – 질병사·천연두·소아마비 ─────────────────
{id:"y19_d01",cat:"2019 기말",q:"다음 사진 속 인물들로부터 짐작할 수 있는 질병의 의학역사 상의 의미에 대한 설명으로 적절하지 못한 것은? (사진: 천연두 관련 인물들, 필기: '천연두')",o:["마마, 적사병 등으로 불렸다","환자의 고통을 이용한 접종법 사용으로 지구상에서 근절된 최초의 질병이다","과거 15세기 신대륙 발견 후 인류가 최초로 사용한 생물학적 무기였다","매독(great pox)과 구분하기 위해 smallpox라는 용어가 사용되었다","질병 예방과 근절에서 원인에 대한 지식이 필수적이지 않음을 보인 사례이다"],a:1,exp:"천연두 근절에 사용된 것은 우두(소의 고름)를 이용한 '우두법(Vaccination)'으로, '환자의 고통을 이용한 접종법'으로 근절된 것이 아닙니다."},
{id:"y19_d02",cat:"2019 기말",q:"소아마비는 뇌, 척수와 같은 중추 신경계 중 특히 운동을 담당하는 부분에 급성 감염으로 뇌신경조직 손상을 초래하여 일시적 또는 영구적 신체 마비와 변형 유발하는 질환이다. 다음은 소아마비 극복을 위한 연구 역사에서 중요한 교두보를 마련한 사건들을 정리한 것이다. 각각에 대한 의미를 설명한 것으로 적절한 것은? (나. 1939년 흰쥐에 폴리오바이러스를 감염시켜 생쥐에서 소아마비 유발 성공)",o:["가: 원인 병원체에 대한 생물학적 연구와 항원 성분의 대량 확보 가능","나: 연구에 필요한 시설 및 재원을 줄일 수 있어 연구자의 저변 확대 가능","다: 질병의 병태생리를 연구할 수 있는 질병 모델을 개발함","라: 투여방법이 간편하여 어린이들의 예방접종에 도움 가능","마: 질병 발생 가능성 없이 예방접종이 가능해짐"],a:1,exp:"흰쥐/생쥐로 소아마비 모델을 구축하면 영장류보다 비용·시설이 줄어 연구자 저변이 넓어집니다."},

// ── 2019 기말 – 기원전 430년 아테네 역병 ────────────────
{id:"y19_z01",cat:"2019 기말",q:"기원전 430년경 아테네의 역병을 기록한 그리스 역사가 투키디데스(Thucydides) 시절 이후 21세기 현재까지 전염병에 대한 고찰을 바탕으로 다음과 같이 정리할 경우 A에 들어갈 것을 기술하시오. (1점) ('아무리 고도의 기술을 동원하여 고안한 치료법도 유행병을 억제하지 못할 수 있다. / 의학적 개입은 새로운 질병을 만들어 내거나 기존의 것들을 악화시킬 수 있다. / 전염병에 영향을 주는 A 는(은) 변하지 않는다.')",o:["사회적 요인","환경 요인","생물학적 요인","유전적 요인","기후 요인"],a:0,exp:"'사회적 요인'(빈부격차, 차별, 전쟁 등)은 전염병에 지속적으로 영향을 주며 변하지 않는다는 것이 핵심 통찰입니다."},
{id:"d01",cat:"2023 기말",q:"천연두에 대한 설명으로 적절하지 못한 것은?",o:["마마, 적사병 등으로 불렸다","환자의 고름을 이용한 인두법으로 지구상에서 근절된 최초의 질병이다","15세기 신대륙 발견 후 인류가 최초로 사용한 생물학적 무기였다","매독(great pox)과 구분하기 위해 smallpox라는 용어가 사용되었다","질병 예방과 근절에서 원인에 대한 지식이 필수적이지 않음을 보인 사례이다"],a:1,exp:"천연두 근절에 사용된 것은 환자의 고름을 이용한 인두법이 아니라, 소(牛)의 고름을 이용한 우두법(제너)입니다."},
{id:"d02",cat:"2023 기말",q:"가축을 가리키는 의학 용어 중 소(牛)를 가리키는 것은?",o:["Avian","Bovine","Swine","Feline","Simian"],a:1,exp:"Bovine=소과, Avian=조류, Swine=돼지, Feline=고양이, Simian=유인원, Equine=말, Canine=개입니다."},
{id:"d03",cat:"2023 기말",q:"나병 환자들의 인권을 위해 원인 병원체 발견자의 이름을 따 현재 부르는 명칭은?",o:["코흐병","파스퇴르병","한센병","리스터병","제멜바이스병"],a:2,exp:"Mycobacterium leprae를 발견한 노르웨이 의사 게르하르 헨리크 아르마우어 한센의 이름을 따 한센병이라 부릅니다."},
{id:"d04",cat:"2023 기말",q:"소아마비 연구 '1909년 원숭이에서 소아마비 발생 시험 성공'의 의의는?",o:["원인 병원체 생물학적 연구와 항원 성분 대량 확보 가능","연구 시설·재원을 줄여 연구자 저변 확대","질병 병태생리 연구를 위한 질병 모델 개발","투여 방법이 간편하여 어린이 예방접종에 도움","질병 발생 가능성 없이 예방접종 가능"],a:2,exp:"원숭이에서 소아마비를 발생시키는 데 성공함으로써 질병 병태생리 연구를 위한 질병 모델이 개발되었습니다."},
{id:"d05",cat:"2023 기말",q:"소아마비 연구 '1949년 인류 역사상 최초로 바이러스 배양법 개발'의 의의는?",o:["원인 병원체 생물학적 연구와 항원 성분 대량 확보 가능","연구 시설·재원을 줄여 연구자 저변 확대","질병 병태생리 연구를 위한 질병 모델 개발","투여 방법이 간편하여 어린이 예방접종에 도움","질병 발생 가능성 없이 예방접종 가능"],a:0,exp:"바이러스 배양법 개발로 항원 성분의 대량 확보가 가능해져 백신 개발의 토대가 마련되었습니다."},
{id:"d06",cat:"2023 기말",q:"소아마비 연구 '1957년 살아있는 바이러스의 독을 약화시킨 경구용 소아마비 백신 발명'의 의의는?",o:["원인 병원체 생물학적 연구와 항원 성분 대량 확보 가능","연구 시설·재원을 줄여 연구자 저변 확대","질병 병태생리 연구를 위한 질병 모델 개발","투여 방법이 간편하여 어린이 예방접종에 도움","질병 발생 가능성 없이 예방접종 가능"],a:3,exp:"경구용 백신(사빈 백신)은 주사가 불필요하여 투여가 간편하므로 어린이 대상 대규모 예방접종에 유리합니다."},
{id:"d07",cat:"2023 기말",q:"세기별 대표 전염병: 15세기 (A), 16세기 매독, 17~18세기 (A)·발진티푸스. A에 들어갈 질병은?",o:["흑사병","천연두","나병","말라리아","홍역"],a:1,exp:"천연두는 15세기 신대륙 발견 후 원주민 대학살의 원인이 되었고, 17~18세기에도 지속적으로 유행했습니다."},

];

// ════════════════════════════════════════════════════════
// STORAGE (localStorage)
// ════════════════════════════════════════════════════════
const SK = 'med_quiz_v2';
function load(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}}
function save(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch(e){}}

let ST = load();
// ST.wrong = {id: {q, myAns, correctAns, exp, cat, opts, timestamp}}
// ST.correct = {id: count}
// ST.total = number
if(!ST.wrong) ST.wrong={};
if(!ST.correct) ST.correct={};
if(!ST.total) ST.total=0;

const CATS = [...new Set(Q.map(q=>q.cat))];
const ICONS = {"2023 기말":"📚","2019 기말":"📋"};

let selCats = new Set(CATS);
let pool = [];
let idx = 0;
let score = 0;
let answered = false;
let sessionWrong = 0;
let sessionCorrect = 0;

// ════════════════════════════════════════════════════════
// UI HELPERS
// ════════════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const map={start:0,wrong:1};
  if(map[id]!==undefined) document.querySelectorAll('.tab')[map[id]].classList.add('active');
  if(id==='start') refreshStart();
  if(id==='wrong') renderWrongList();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ════════════════════════════════════════════════════════
// START SCREEN
// ════════════════════════════════════════════════════════
function refreshStart(){
  document.getElementById('total-cnt').textContent=Q.length;
  document.getElementById('wrong-cnt').textContent=Object.keys(ST.wrong).length;
  document.getElementById('solved-cnt').textContent=ST.total;
  buildCatGrid();
  const wb=document.getElementById('wrong-btn');
  wb.disabled=Object.keys(ST.wrong).length===0;
}

function buildCatGrid(){
  const grid=document.getElementById('cat-grid');
  grid.innerHTML='';
  CATS.forEach(cat=>{
    const cnt=Q.filter(q=>q.cat===cat).length;
    const wc=Object.values(ST.wrong).filter(w=>w.cat===cat).length;
    const card=document.createElement('div');
    card.className='cat-card on';
    card.dataset.cat=cat;
    card.innerHTML=`<div class="ci">${ICONS[cat]||'📚'}</div><div class="cn">${cat}</div><div class="cc">${cnt}문제 ${wc>0?`<span style="color:var(--ng)">오답${wc}</span>`:''}</div>`;
    card.onclick=()=>toggleCat(cat,card);
    grid.appendChild(card);
  });
}

function toggleCat(cat,card){
  if(selCats.has(cat)){selCats.delete(cat);card.classList.remove('on');}
  else{selCats.add(cat);card.classList.add('on');}
}

function toggleAll(){
  const allOn=selCats.size===CATS.length;
  selCats=allOn?new Set():new Set(CATS);
  document.querySelectorAll('.cat-card').forEach(c=>{
    if(selCats.has(c.dataset.cat))c.classList.add('on');
    else c.classList.remove('on');
  });
}

// ════════════════════════════════════════════════════════
// QUIZ ENGINE
// ════════════════════════════════════════════════════════
function startQuiz(mode){
  if(mode==='wrong'){
    const wq=Object.values(ST.wrong).map(w=>Q.find(q=>q.id===w.id)).filter(Boolean);
    if(!wq.length){toast('저장된 오답이 없습니다!');return;}
    pool=shuffle(wq);
  } else {
    const filtered=Q.filter(q=>selCats.has(q.cat));
    if(!filtered.length){toast('카테고리를 하나 이상 선택하세요!');return;}
    pool=shuffle(filtered);
  }
  idx=0;score=0;sessionWrong=0;sessionCorrect=0;answered=false;
  showScreen('quiz');
  renderQ();
}

function renderQ(){
  answered=false;
  const q=pool[idx];
  const total=pool.length;
  document.getElementById('q-prog').textContent=`${idx+1} / ${total}`;
  document.getElementById('q-score').textContent=`정답 ${score}`;
  document.getElementById('pbar-fill').style.width=`${(idx/total)*100}%`;
  document.getElementById('q-cat').textContent=`${ICONS[q.cat]||''} ${q.cat}`;
  document.getElementById('q-text').textContent=q.q;

  const opts=document.getElementById('opts');
  opts.innerHTML='';
  q.o.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="opt-n">${i+1}</span><span>${opt}</span>`;
    btn.onclick=()=>pick(i);
    opts.appendChild(btn);
  });

  document.getElementById('exp-area').innerHTML='';
  document.getElementById('next-wrap').classList.add('hidden');
  document.getElementById('next-btn').textContent=idx===pool.length-1?'결과 보기 →':'다음 문제 →';
}

function pick(chosen){
  if(answered)return;
  answered=true;
  const q=pool[idx];
  const btns=document.querySelectorAll('.opt');
  const isCorrect=chosen===q.a;

  btns.forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.a){
      btn.classList.add(isCorrect?'correct':'correct-hint');
    } else if(i===chosen && !isCorrect){
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dim');
    }
  });

  if(isCorrect){
    score++;sessionCorrect++;ST.total++;
    // Remove from wrong if was there
    if(ST.wrong[q.id]){delete ST.wrong[q.id];}
    if(!ST.correct[q.id])ST.correct[q.id]=0;
    ST.correct[q.id]++;
    const expBox=document.createElement('div');
    expBox.className='exp-box exp-ok';
    expBox.textContent='✅ 정답! '+q.exp;
    document.getElementById('exp-area').appendChild(expBox);
  } else {
    sessionWrong++;ST.total++;
    ST.wrong[q.id]={id:q.id,cat:q.cat,q:q.q,opts:q.o,myAns:chosen,correctAns:q.a,exp:q.exp,timestamp:Date.now()};
    const expBox=document.createElement('div');
    expBox.className='exp-box exp-ng';
    expBox.innerHTML=`❌ 오답. 정답은 <strong>${q.a+1}번 「${q.o[q.a]}」</strong><br><br>${q.exp}`;
    document.getElementById('exp-area').appendChild(expBox);
  }
  save(ST);
  document.getElementById('next-wrap').classList.remove('hidden');
}

function nextQ(){
  idx++;
  if(idx>=pool.length)showResult();
  else renderQ();
}

// ════════════════════════════════════════════════════════
// RESULT
// ════════════════════════════════════════════════════════
function showResult(){
  showScreen('result');
  const total=pool.length;
  const pct=Math.round((score/total)*100);
  document.getElementById('res-s').textContent=score;
  document.getElementById('res-t').textContent=`/ ${total}`;

  let title,msg;
  if(pct>=90){title='🏆 완벽한 실력!';msg=`${pct}점. 훌륭합니다. 의학 역사 전문가 수준이에요!`;}
  else if(pct>=70){title='👍 잘했습니다!';msg=`${pct}점. 조금만 더 복습하면 완벽해요.`;}
  else if(pct>=50){title='📚 더 공부해요';msg=`${pct}점. 오답 노트를 다시 풀어보세요.`;}
  else{title='💪 다시 도전!';msg=`${pct}점. 포기하지 마세요. 반복이 답입니다.`;}
  document.getElementById('res-title').textContent=title;
  document.getElementById('res-msg').textContent=msg;

  const catStats={};
  pool.forEach(q=>{if(!catStats[q.cat])catStats[q.cat]={total:0,correct:0};catStats[q.cat].total++;});
  pool.forEach((q,i)=>{if(i<pool.length&&catStats[q.cat]){/* will count below */}});
  // Re-count by tracking which were correct
  // Simple: use score tracking per cat
  const catRight={};
  pool.forEach(q=>{if(!catRight[q.cat])catRight[q.cat]=0;});
  // We don't have per-Q result easily, so use ST.wrong from this session
  pool.forEach(q=>{
    if(!ST.wrong[q.id])catRight[q.cat]=(catRight[q.cat]||0)+1;
    // Note: this might count previously-wrong-and-now-correct too, approximate
  });

  const bd=document.getElementById('breakdown');
  bd.innerHTML=`<div class="bd-title">카테고리별 결과 (이번 세션)</div>`+
    Object.entries(catStats).map(([cat,s])=>{
      const c=catRight[cat]||0;
      const w=s.total-c;
      return `<div class="bd-item"><span>${ICONS[cat]||''} ${cat}</span><span><span class="bd-ok">${c}정</span> <span class="bd-ng">${w}오</span> / ${s.total}</span></div>`;
    }).join('');

  const rb=document.getElementById('res-retry');
  rb.disabled=Object.keys(ST.wrong).length===0;
}

// ════════════════════════════════════════════════════════
// WRONG NOTE
// ════════════════════════════════════════════════════════
function renderWrongList(){
  const list=document.getElementById('wrong-list');
  const btns=document.getElementById('wrong-btns');
  const entries=Object.values(ST.wrong).sort((a,b)=>b.timestamp-a.timestamp);
  document.getElementById('wn-count').textContent=`총 ${entries.length}문제`;

  if(!entries.length){
    list.innerHTML=`<div class="empty-wrong"><div class="empty-icon">🎉</div><div style="font-size:18px;font-family:'Noto Serif KR',serif;margin-bottom:8px">오답이 없습니다!</div><div style="font-size:13px;color:var(--mu)">모든 문제를 맞혔거나 아직 풀지 않았습니다.</div></div>`;
    btns.innerHTML='';
    return;
  }

  list.innerHTML=entries.map(w=>`
    <div class="wrong-item" onclick="toggleWrongDetail('${w.id}')">
      <div class="wi-cat">${ICONS[w.cat]||''} ${w.cat}</div>
      <div class="wi-q">${w.q}</div>
      <div class="wi-detail" id="wd-${w.id}">
        <div>내 답: <span style="color:var(--ng)">${w.myAns+1}번 「${w.opts[w.myAns]}」</span></div>
        <div class="wi-ans">정답: ${w.correctAns+1}번 「${w.opts[w.correctAns]}」</div>
        <div class="wi-exp">${w.exp}</div>
      </div>
    </div>
  `).join('');

  btns.innerHTML=`
    <button class="btn-p" onclick="startQuiz('wrong')">오답 다시 풀기 →</button>
    <button class="btn-s" onclick="clearWrong()">오답 초기화</button>
  `;
}

function toggleWrongDetail(id){
  const d=document.getElementById('wd-'+id);
  if(d)d.classList.toggle('open');
}

function clearWrong(){
  if(!confirm('오답 기록을 모두 삭제하시겠습니까?'))return;
  ST.wrong={};save(ST);
  toast('오답 기록이 초기화되었습니다.');
  renderWrongList();
  refreshStart();
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
refreshStart();
</script>
